# Feature vocabulary for devices/*/device.toml [features], in display order.
# States:
#   working: seen working on this board.
#   untested: a driver exists that could do it, and nobody has tried it here.
#   missing: no driver, or one known not to do it (a read-only driver: storage_write is missing).
#   none: the model has no such hardware.
# A state says what's true of the feature. Don't use it to allow or block something:
# installing follows from these states (hardware.install_blockers) and promises no working system.
display = "Display"
screen_off = "Screen on/off"
backlight = "Backlight"
touch = "Touchscreen"
buttons = "Buttons"
accelerometer = "Accelerometer"
gyroscope = "Gyroscope"
light_sensor = "Light sensor"
touch_id = "Touch ID"
storage_read = "Internal storage read"
storage_write = "Internal storage write"
wifi = "Wi-Fi"
bluetooth_input = "Bluetooth input devices"
bluetooth_audio = "Bluetooth audio"
cellular = "Cellular"
battery = "Battery status"
charging = "Charging"
charging_control = "Charging control"
suspend = "Suspend"
resume = "Resume"
usb_serial = "USB serial"
usb_network = "USB network"
audio_output = "Speakers"
audio_input = "Microphone"
camera = "Cameras"
video_decode_hevc = "Hardware H.265 video decoding"
warm_restart = "Warm restart"
