# iPad 5 (Cellular, Samsung) (J72S, S8000 Samsung): hardware identity and firmware recipe.
# The S8000 PCIe block has no phy-ip and iOS has no lane init for it, so storage
# and Wi-Fi aren't described yet: this model can't install.
schema = 1
kind = "hardware.device"

[device]
profile = "j72s"
name = "iPad 5 (Cellular, Samsung)"
apple_products = ["iPad6,12"]
dt_compatible = ["apple,j72s"]

# BDID: ApChipID/ApBoardID of the j72sap identities in the 20H350 (iPadOS 16.7.10) BuildManifest.plist.
[match.dfu]
chip = 0x8000
board = 0x12

[boot]
methods = ["checkm8-pongo"]

[kernel]
platform = "apple-16k" # kernel/series/apple-16k, kernel/configs/apple-16k
dtb = "s8000-j72s"

[firmware]
recipe = "firmware.json"
# Wi-Fi files are for brcm,board-type "apple,fearb" (the wlan module-instance in the
# IPSW's DeviceTree.j72sap), the same as j72t's. They wait for PCIe on the S8000.

[support]
status = "experimental"

# States: working, untested, missing, none (features.toml).
[features]
display = "untested"
screen_off = "untested"
backlight = "untested"
touch = "untested"
buttons = "untested"
accelerometer = "missing"
gyroscope = "missing"
light_sensor = "untested"
touch_id = "missing"
storage_read = "missing"
storage_write = "missing"
wifi = "missing"
bluetooth_input = "untested"
bluetooth_audio = "untested"
cellular = "missing"
battery = "untested"
charging = "untested"
charging_control = "untested"
suspend = "untested"
resume = "untested"
usb_serial = "untested"
usb_network = "untested"
audio_output = "untested"
audio_input = "untested"
camera = "missing"
video_decode_hevc = "untested"
