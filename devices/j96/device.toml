# iPad mini 4 (Wi-Fi) (J96): identity from public sources (tools/catalog/generate),
# hardware description in OrchardLinux/linux (arm64: dts: apple: t7000-mini4). Bring-up record:
# docs/bring-up/j96.md.
schema = 1
kind = "hardware.device"

[device]
profile = "j96"
name = "iPad mini 4 (Wi-Fi)"
apple_products = ["iPad5,1"]
dt_compatible = ["apple,j96"]

[match.dfu]
chip = 0x7000
board = 0x08

[boot]
methods = ["checkm8-pongo"] # Tested with orchard-install.pyz install and launch (Omarchy A 0.3.6).

[kernel]
platform = "apple-4k"
dtb = "t7000-j96" # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Pins this board's public IPSW; the GPU firmware comes from the iPod touch 6's iOS 12.4 (16G77), the tested one.

[support]
status = "experimental"
tested_by = ["tcballard"] # omarchy-a issue #69; GPU in #196

# States: working, untested, missing, none (features.toml). Verified on an
# installed Omarchy A 0.3.6 system on Orchard's apple-4k kernel (with
# OrchardLinux/linux#10 for touch, Tristar D2207 charging, and disp0 disabled):
# display (simpledrm), GPU desktop (PowerVR via Zink), backlight (apple-dwi),
# screen on/off, touch (apple_z2 C1F14,4), buttons, internal storage (ANS1/asp),
# Wi-Fi (BCM4350 C5), battery (bq27540 over HDQ), Lightning charging (USB host
# 500 mA), s2idle suspend/resume, and USB gadget console/network.
[features]
display = "working"
screen_off = "working" # Backlight darkens on idle and lights again on Home (21-29 ms wake)
backlight = "working"
gpu_desktop = "working" # PowerVR Apple A8 via Zink on simpledrm; omarchy-gpu-probe passes in 1.1 s
touch = "working" # apple_z2 (C1F14,4): family 20, 32x24, 11980x15974, shifted_reply_header
buttons = "working"
accelerometer = "missing"
gyroscope = "missing"
light_sensor = "missing"
touch_id = "missing"
storage_read = "working" # ANS1/asp on installed Omarchy A 0.3.6
storage_write = "working" # ANS1/asp on installed Omarchy A 0.3.6
wifi = "working" # BCM4350 over PCIe (brcmfmac); C2 and C5 modules exist, C5 seen working.
bluetooth_input = "missing" # BlueTool has two Zinfandel patchrams per vendor (by controller revision); hci_bcm chooses by vendor only, so a unit's one isn't decidable yet
bluetooth_audio = "missing" # Same as Bluetooth input
cellular = "none"
battery = "working" # bq27xxx over HDQ (W1_MASTER_UART).
charging = "working" # Tristar + D2207 (apple_tristar_charger): host USB [SDP] 500 mA verified; wall adapter untested
charging_control = "untested" # USB role handoff across sleep verified; wall-adapter BrickID/unplug withdrawal not yet tested
suspend = "working" # s2idle on idle, ANS and USB session survive sleep
resume = "working" # Home wakes in ~21-29 ms; display, touch, GPU, Wi-Fi, USB network return
usb_serial = "working"
usb_network = "working"
usb_host = "missing"
audio_output = "missing"
audio_input = "missing"
camera = "missing"
video_decode_hevc = "missing"
