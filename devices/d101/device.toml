# iPhone 7 (Intel) — D101: hardware identity, boot assets and firmware recipe.
schema = 1
kind = "hardware.device"

[device]
profile = "d101"
name = "iPhone 7 (Intel)"
apple_products = ["iPhone9,3"]
dt_compatible = ["apple,d101"]

# BDID: ApBoardID/ApChipID of the d101ap identities in the 19H422 (iOS 15.8.8) BuildManifest.plist;
# cross-checked with api.ipsw.me/v4/device/iPhone9,3 ("bdid").
[match.dfu]
chip = 0x8010
board = 0x0c

[boot]
methods = ["checkm8-pongo"]
# Not published yet: no d101 launcher release exists. Mirrors the j71b URL pattern.

[kernel]
platform = "apple-16k" # kernel/series/apple-16k, kernel/configs/apple-16k
dtb = "t8010-d101"     # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Relative to this device.toml; public recipe, not firmware bytes.
# Wi-Fi files are for brcm,board-type "apple,elsa": the wlan module-instance in
# the IPSW's DeviceTree.d101ap. The DT doesn't describe Wi-Fi yet.
# Touch, once the DT describes it: D10.mtprops profile "C1F5D,2", z2fw-from-mtprops@2.

[support]
status = "experimental"

# States: working, untested, missing, none (features.toml).
[features]
usb_host = "missing"
warm_restart = "untested"
display = "untested"
screen_off = "untested"
backlight = "untested"
touch = "missing"
buttons = "untested"
accelerometer = "untested"
gyroscope = "missing"
light_sensor = "missing"
touch_id = "missing"
storage_read = "untested"
storage_write = "untested"
wifi = "missing"
bluetooth_input = "missing"
bluetooth_audio = "missing"
cellular = "missing"
battery = "missing"
charging = "missing"
charging_control = "missing"
suspend = "untested"
resume = "untested"
usb_serial = "untested"
usb_network = "untested"
audio_output = "missing"
audio_input = "missing"
camera = "missing"
video_decode_hevc = "missing"
