# iPad mini 1 Wi-Fi (P105): identity and manual boot prerequisites.
schema = 1
kind = "hardware.device"

[device]
profile = "p105"
name = "iPad mini 1 (Wi-Fi)"
apple_products = ["iPad2,5"]
dt_compatible = ["apple,p105ap"]

[match.dfu]
chip = 0x8942
board = 0x0a

[boot]
methods = ["jailbreak-kdfu", "recovery-autogo"]
entries = ["pico-checkm8", "kdfu"]
# The CLI consumes an owner-private boot manifest. Public launch assets await release integration.

[kernel]
platform = "apple-armv7"  # kernel/series/apple-armv7, kernel/configs/apple-armv7
dtb = "s5l8942x-p105"       # arch/arm/boot/dts/apple/<dtb>.dtb

[firmware]
# Encrypted IPSW: keys from the launcher's cache (docs/bring-up/p105-firmware.md).
recipe = "firmware.json"

# The iOS disk's translation layer writes append-only: until reclamation lands
# (OrchardLinux/orchard#93), freed space is never reused and writes fail once
# the blank flash runs out. Drop this table when it lands; the installer
# warns from it and allows the install either way.
[storage]
reclaims = false

[support]
status = "experimental"

# States: working, untested, missing, none (features.toml).
[features]
usb_host = "missing"
warm_restart = "untested"
display = "untested"
screen_off = "untested"
backlight = "untested"
touch = "untested"
buttons = "untested"
accelerometer = "missing"
gyroscope = "missing"
light_sensor = "missing"
touch_id = "missing"
# The H2FMI driver reads the NAND and programs verified pages; this revision is
# untested on hardware (docs/bring-up/p105-nand-reads.md, p105-nand-program.md).
storage_read = "untested"
storage_write = "untested"
wifi = "untested"
bluetooth_input = "untested"
bluetooth_audio = "untested"
cellular = "none"
battery = "untested"
charging = "untested"
charging_control = "untested"
suspend = "missing"
resume = "missing"
# The cold-handoff USB topic awaits an exact-revision boot.
# See docs/bring-up/p105-usb-handoff.md for observations and software checks.
usb_serial = "untested"
usb_network = "untested"
audio_output = "untested"
audio_input = "untested"
camera = "missing"
video_decode_hevc = "missing"
