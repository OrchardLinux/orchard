# iPad mini 1 Wi-Fi (P105): identity and manual boot prerequisites.
schema = 1
kind = "hardware.device"

[device]
profile = "p105"
name = "iPad mini 1 (Wi-Fi)"
apple_products = ["iPad2,5"]
dt_compatible = ["apple,p105ap"]

[match.dfu]
chip = 0x8942
board = 0x0a

[boot]
# Public recovery uses a host-bound USB identity handoff; hardware qualification is pending.
# Source-built Cascadia payload profile: cascadia.toml. External-initramfs handoff awaits testing.
methods = ["jailbreak-kdfu", "recovery-autogo"]
entries = ["pico-checkm8", "kdfu"]
# The CLI consumes an owner-private boot manifest. Public launch assets await release integration.

[kernel]
platform = "apple-armv7"  # kernel/series/apple-armv7, kernel/configs/apple-armv7
dtb = "s5l8942x-p105"       # arch/arm/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json"

[support]
status = "experimental"

# States: working, untested, missing, none (features.toml).
[features]
display = "untested"
screen_off = "untested"
backlight = "untested"
touch = "untested"
buttons = "untested"
accelerometer = "missing"
gyroscope = "missing"
light_sensor = "missing"
touch_id = "missing"
# PPN geometry/read topic and native-map provider await exact-build qualification.
# See docs/bring-up/p105-nand-reads.md.
# The bounded native VFL/SFTL reader awaits an exact-revision device boot.
# Native append, footer replay and write policy also await device qualification.
# See docs/bring-up/p105-sftl-reader.md and p105-sftl-append.md; install stays gated.
storage_read = "missing"
# The default-off complete-page primitive does not provide a qualified logical writer.
# See docs/bring-up/p105-nand-program.md for its checks and pending hardware work.
storage_write = "missing"
wifi = "untested"
bluetooth_input = "untested"
bluetooth_audio = "untested"
cellular = "none"
battery = "untested"
charging = "untested"
charging_control = "untested"
suspend = "missing"
resume = "missing"
usb_serial = "untested"
usb_network = "untested"
audio_output = "untested"
audio_input = "untested"
camera = "missing"
