# iPad mini 1 Wi-Fi (P105): identity and manual boot prerequisites.
schema = 1
kind = "hardware.device"

[device]
profile = "p105"
name = "iPad mini 1 (Wi-Fi)"
apple_products = ["iPad2,5"]
dt_compatible = ["apple,p105ap"]

[match.dfu]
chip = 0x8942
board = 0x0a

[boot]
methods = ["jailbreak-kdfu", "recovery-autogo", "recovery-bootx"]
entries = ["pico-checkm8", "kdfu"]
# The CLI consumes an owner-private boot manifest. Public launch assets await release integration.

[kernel]
platform = "apple-armv7"  # kernel/series/apple-armv7, kernel/configs/apple-armv7
dtb = "s5l8942x-p105"       # arch/arm/boot/dts/apple/<dtb>.dtb

[firmware]
# Encrypted IPSW: keys from the launcher's cache (docs/bring-up/p105-firmware.md).
recipe = "firmware.json"

# The measured 64 GB P105 qualified native SFTL reclamation on 23 November
# 2026. Linux erased every lane of an obsolete block, published the updated
# accounting, reused it, and recovered the result on a fresh load. Paired iOS
# boots left both HFS filesystems clean. The flash driver offers erase for
# every package whose geometry it discovers and validates, the 16 GB one too,
# but the 16 GB disk stays read-only: SFTL does not model its writer yet.
# See docs/bring-up/p105-sftl-device-qualification.md.
[storage]
reclaims = true

[support]
status = "experimental"
tested_by = ["shaynelegault"]
# Issue #79: the four kernel alignment handlers passed fault probes on a
# flash-disabled RAM boot (docs/bring-up/p105-alignment.md).

# States: working, untested, missing, none (features.toml).
[features]
display = "working"
screen_off = "untested"
backlight = "untested"
gpu_desktop = "missing"
touch = "untested"
buttons = "untested"
accelerometer = "missing"
gyroscope = "missing"
light_sensor = "missing"
touch_id = "missing"
# On the 64 GB P105, the whole logical disk matched an independent
# reconstruction from raw flash captured during the same boot.
# A 64 MiB file written through SFTL survived fresh Linux recovery and two
# iOS boots with an unchanged SHA-256. The 16 GB package's layout
# (Cascadia's, mtd 0018) is read-only (no writer modelled) and has not run on
# a tablet.
storage_read = "working"
storage_write = "working"
wifi = "untested"
bluetooth_input = "untested"
bluetooth_audio = "untested"
cellular = "none"
battery = "untested"
charging = "untested"
charging_control = "untested"
suspend = "missing"
resume = "missing"
# The issue #79 RAM boot verified both functions over the attached cable.
# Cold-handoff qualification is tracked in docs/bring-up/p105-usb-handoff.md.
usb_serial = "working"
usb_network = "working"
usb_host = "missing"
audio_output = "untested"
audio_input = "missing"
camera = "missing"
video_decode_hevc = "missing"
