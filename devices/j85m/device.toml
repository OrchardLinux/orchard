# iPad mini 3 (Wi-Fi) (J85M): identity from public sources
# (tools/catalog/generate). In its platform's kernel, no bring-up yet; see docs/device-bring-up.md.
schema = 1
kind = "hardware.device"

[device]
profile = "j85m"
name = "iPad mini 3 (Wi-Fi)"
apple_products = ["iPad4,7"]
dt_compatible = ["apple,j85m"]

[match.dfu]
chip = 0x8960
board = 0x32

[boot]
methods = ["checkm8-pongo"] # checkra1n's device list (checkra.in); not run on this board with Orchard yet.
entries = ["checkra1n"]

[kernel]
platform = "apple-4k"
dtb = "s5l8960x-j85m" # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Pins this board's public IPSW; converts nothing until bring-up needs it.

[support]
status = "experimental"

# States: working, untested, missing, none (features.toml). Nothing here has run on
# this board with Orchard: "untested" means a driver binds in its device tree
# (tools/catalog/drivers.json), plus the display's boot console.
[features]
display = "untested"
screen_off = "untested" # backlight off through apple_pmic_bl (PMIC 0x600, mini2.dtsi through mini3.dtsi), as on the J72 (#232)
backlight = "untested"
gpu_desktop = "missing"
touch = "untested" # N1 on SPI1 as on the J85 (ADT spi1/multi-touch, multi-touch,j85), J85.mtprops firmware; not yet run on this board
buttons = "untested"
accelerometer = "untested" # apple-oscar on the M7 (UART4); this board's ADT also has oscar1_clock (a D2089 GPIO clock) that the driver does not turn on yet
gyroscope = "untested" # apple-oscar on the M7 (UART4); not mapped or used on any board yet
light_sensor = "untested" # CT819 on i2c3 (ADT i2c3/als) with tsl2583, calibrated by the LSCI v2 record m1n1 copies; not yet run on this board
touch_id = "missing"
storage_read = "untested" # ANS (iop,s5l8960x) at the same address as on the J72, whose storage reads and writes with Orchard (ADT /arm-io/ans); not yet run on this board
storage_write = "untested" # same ANS and asp driver as the J72; not yet run on this board
wifi = "missing" # the radio is described (EHCI1 port 1, ADT usb-ehci1/wlan) and the transport starts it, but iOS 12.5.8 ships no villarda TRX/NVRAM (only the kext names villardA/B/C), so there is no firmware recipe
bluetooth_input = "untested" # same UART1 BCM4324B5 node as the J85 (s5l8960x-mini2), where a keyboard and A2DP headphones work; not run on a J85M; the Patchram recipe is not added yet (its BlueTool comes from the TouchID IPSW, whose output hash is not checked), so hci_bcm runs the ROM firmware
bluetooth_audio = "untested" # same UART1 BCM4324B5 node as the J85 (s5l8960x-mini2), where a keyboard and A2DP headphones work; not run on a J85M; the Patchram recipe is not added yet (its BlueTool comes from the TouchID IPSW, whose output hash is not checked), so hci_bcm runs the ROM firmware
cellular = "missing"
battery = "untested" # BQ2754x on UART5 HDQ, as on every A7 iPad (ADT uart5/gas-gauge), with the J72 gauge profile; not yet run on this board
charging = "untested" # the shared A7 Tristar charger on the D2089 (ADT pmu,d2089 + tristar,cbtl1610), up to 1500 mA as measured on a J85; not yet run on this board
charging_control = "untested" # as on the J72: source identified at each plug, grant ramped, back to 100 mA on unplug; not yet run on this board
suspend = "untested"
resume = "untested"
usb_serial = "untested"
usb_network = "untested"
usb_host = "missing"
audio_output = "untested" # two CS35L19 on I2C2 + MCA1, the same as the J85 (ADT i2c2/audio-speaker0/1, mca1); "iPad mini Speakers" card; not yet run on this board
audio_input = "missing"
camera = "missing"
video_decode_hevc = "none" # the A7 decoder is an H.264-generation VXD: Apple's device tree gives it vxd-version 4 and only an h264-playback-level, iOS 12.5.8 drives it with AppleVXD393, and Apple's HEVC rule (AppleD5500) takes vxd-version 7, 9 and 10 only
