# iPad Air (Cellular) — J72: hardware identity, boot assets and firmware recipe.
# iPad Air support comes from Cam K's (thisiscamk) port, thisiscamk/ipad-air-j72-linux
# (2a257d6, 2026-11-16). "Seen working" below cites his repository: README.md's table,
# J72-PROGRESS.md and the result files named per feature. He ran his own 7.3 kernel;
# features whose driver Orchard carries in a different form stay "untested" until he
# runs this branch.
schema = 1
kind = "hardware.device"

[device]
profile = "j72"
name = "iPad Air (Cellular)"
apple_products = ["iPad4,2"]
dt_compatible = ["apple,j72"]

# BDID: ApChipID/ApBoardID of the j72ap identities in the 16H81 (iOS 12.5.7) BuildManifest.plist.
[match.dfu]
chip = 0x8960
board = 0x12

[boot]
methods = ["checkm8-pongo"] # history/plans-and-reports/NATIVE-CLI-BOOT-2026-11-03.md: Orchard RAM boot through checkra1n/Pongo

[kernel]
platform = "apple-4k"  # kernel/series/apple-4k, kernel/configs/apple-4k: A7 has no 16 KiB pages
dtb = "s5l8960x-j72"   # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Relative to this device.toml; public recipe, not firmware bytes.

[support]
status = "experimental"
tested_by = ["thisiscamk"]

# States: working, untested, missing, none (features.toml).
[features]
display = "working" # README.md, J72-PROGRESS.md: portrait desktop on the boot framebuffer
screen_off = "working" # screen off and wake on the installed Omarchy A 0.3.6 (thisiscamk, 2026-11-25, #232)
backlight = "working" # README.md, J72-PROGRESS.md: brightness changes confirmed
gpu_desktop = "missing"
touch = "working" # Orchard's apple_z2 J72 variant: 2,252 events in a 20 s hardware-check touch run, no apple-z2/SPI error (thisiscamk, 2026-11-22)
buttons = "working" # README.md, J72-PROGRESS.md: Home button confirmed
accelerometer = "untested" # apple-oscar on the M7 (UART4), as on the J71 where it works; same ADT wiring
gyroscope = "untested" # apple-oscar on the M7 (UART4); its axes are the accelerometer's on the iPad Air (Wi-Fi), J71 2026-11-27; not read on this board
light_sensor = "untested" # CT819 at 0x39 on i2c0 or i2c3 (ADT als-i2c0/als-i2c3, probe-for-hardware) with tsl2583; uncalibrated lux, the ADT carries no LSCI; works on the J71; not yet run on this board
touch_id = "none"
storage_read = "working" # Orchard's asp with the RTKit 10 fixes: 128 GB device and its three partitions read, no I/O error (hardware-check, thisiscamk, 2026-11-22)
storage_write = "working" # orchard install of Omarchy to /dev/asp0n1p3 succeeded and booted, iPadOS intact, without write limits (max_hw_sectors_kb 2032) (thisiscamk, 2026-11-23)
wifi = "working" # associated normally and kept SSH up on Omarchy A 0.3.6 with the released kernel (thisiscamk, 2026-11-25, #232)
bluetooth_input = "untested" # same UART1 BCM4324B5 node as the J71 (s5l8960x-air1), where Bluetooth audio works; not run on a J72
bluetooth_audio = "untested" # same UART1 BCM4324B5 node as the J71 (s5l8960x-air1), where Bluetooth audio works; not run on a J72
cellular = "missing"
battery = "working" # current, 70% to 71% while charging, and 32.5 to 32.6 C read on Omarchy A 0.3.6 with no gauge error (thisiscamk, 2026-11-25, #240)
charging = "working" # Powered hub identified as CDP at 1500 mA after replug; 11 settled samples charged at +399 to +412 mA, 70% to 71%, 32.5 to 32.6 C, with no power-driver error (thisiscamk, 2026-11-25)
charging_control = "working" # Direct Pi cable was limited to 500 mA as SDP; unplug withdrew to the 100 mA handoff; powered-hub replug restored CDP and 1500 mA without a charger, PMIC, gauge, thermal, timeout or I/O error (thisiscamk, 2026-11-25)
suspend = "untested"
resume = "untested"
usb_serial = "working" # history/plans-and-reports/NATIVE-CLI-BOOT-2026-11-03.md: Orchard RAM console over USB serial
usb_network = "working" # same report: NCM and SSH
usb_host = "missing"
audio_output = "working" # left and right channels played and confirmed separately on Omarchy A 0.3.6 (thisiscamk, 2026-11-25, #232)
audio_input = "missing"
camera = "missing"
video_decode_hevc = "none" # the A7 decoder is an H.264-generation VXD: Apple's device tree gives it vxd-version 4 and only an h264-playback-level, iOS 12.5.8 drives it with AppleVXD393, and Apple's HEVC rule (AppleD5500) takes vxd-version 7, 9 and 10 only
