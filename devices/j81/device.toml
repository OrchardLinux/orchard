# iPad Air 2 (Wi-Fi) — J81: hardware identity, boot assets and firmware recipe.
# iPad Air 2 support comes from Martin Puškáč's port (mattonik/ipad-nixos), handed to Orchard
# by micro23 (micro23/ipadair2-omarchy).
schema = 1
kind = "hardware.device"

[device]
profile = "j81"
name = "iPad Air 2 (Wi-Fi)"
apple_products = ["iPad5,3"]
dt_compatible = ["apple,j81"]

# BDID: ApChipID/ApBoardID of the j81ap identities in the 19H422 (iPadOS 15.8.8) BuildManifest.plist.
[match.dfu]
chip = 0x7001
board = 0x06

[boot]
methods = ["checkm8-pongo"]

[kernel]
platform = "apple-4k"  # kernel/series/apple-4k, kernel/configs/apple-4k: A8X has no 16 KiB pages
dtb = "t7001-j81"       # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Relative to this device.toml; public recipe, not firmware bytes.

[support]
status = "experimental"

# States: working, untested, missing, none (features.toml).
[features]
display = "working"
screen_off = "working" # dark on idle and on Power, Home or Power lights it again; J81 2026-11-20
backlight = "working"
touch = "working"
buttons = "working"
accelerometer = "missing"
gyroscope = "missing"
light_sensor = "missing"
touch_id = "missing"
storage_read = "working"
storage_write = "working"
wifi = "working"
bluetooth_input = "working" # Bluetooth keyboard with touchpad: typing in a terminal and moving the pointer, 2026-11-20
bluetooth_audio = "working" # A2DP to Bose QC45 headphones from Omarchy, 2026-11-20; crackles while the CPU and memory are saturated
cellular = "none"
battery = "working"
charging = "working" # Mac USB-C port (BC1.2 charging port) and Apple USB-C adapter: 1500 mA; installed Omarchy and RAM boot; J81 2026-11-21
charging_control = "working" # source identified at each plug and after sleep, grant withdrawn on unplug; J81 2026-11-21
suspend = "working" # s2idle from idle and from Power, cable in and out, 5 of 5 (21 s to 1 h; about 2%/h battery); J81 2026-11-20
resume = "working" # Home or Power wakes it: display, touch, Wi-Fi, Bluetooth and USB network come back; J81 2026-11-20
usb_serial = "working"
usb_network = "working"
usb_host = "missing"
audio_output = "working" # Both speakers (MAX98721 on MCA3); tested 2026-11-20. The headphone jack (CS42L81) is not supported yet.
audio_input = "missing"
camera = "missing"
video_decode_hevc = "missing"
