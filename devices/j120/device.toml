# iPad Pro 12.9-inch (2017), Wi-Fi: J120 / iPad7,1 / A1670.
schema = 1
kind = "hardware.device"

[device]
profile = "j120"
name = "iPad Pro 2 (12.9-inch, Wi-Fi)"
apple_products = ["iPad7,1"]
dt_compatible = ["apple,j120"]

[match.dfu]
chip = 0x8011
board = 0x0c

[boot]
methods = ["checkm8-pongo"] # RAM and tethered internal ext4 boot on J120.

[kernel]
platform = "apple-16k"
dtb = "t8011-j120" # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Pinned touch, BCM4355 C0 WLAN and AOP firmware.

[support]
status = "experimental"

[features]
display = "working"
screen_off = "missing"
backlight = "working"
touch = "working"
buttons = "working" # Power/Home and polled Smart Cover close. Cover-open wake needs an IRQ.
accelerometer = "working"
gyroscope = "untested"
light_sensor = "working"
touch_id = "missing"
storage_read = "working"
storage_write = "working"
wifi = "working"
bluetooth_input = "working"
bluetooth_audio = "working"
cellular = "none"
battery = "working"
charging = "working" # Guarded Lightning charging.
charging_control = "missing"
suspend = "working"
resume = "working"
usb_serial = "working"
usb_network = "working"
usb_host = "missing"
audio_output = "working"
audio_input = "working"
camera = "missing"
video_decode_hevc = "working"
