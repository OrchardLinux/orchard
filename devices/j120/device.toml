# iPad Pro 2 (12.9-inch, Wi-Fi) (J120): identity from public sources
# (tools/catalog/generate). Integrated from tompta1's bring-up (#205); the iPad
# Pro 2 device tree (t8011-pro2.dtsi) is shared with J121, J207 and J208.
schema = 1
kind = "hardware.device"

[device]
profile = "j120"
name = "iPad Pro 2 (12.9-inch, Wi-Fi)"
apple_products = ["iPad7,1"]
dt_compatible = ["apple,j120"]

[match.dfu]
chip = 0x8011
board = 0x0c

[boot]
methods = ["checkm8-pongo"] # palera1n's device list (palera.in); tompta1 booted Linux through m1n1 (see README).

[kernel]
platform = "apple-16k"
dtb = "t8011-j120" # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Touch, BCM4355 C0 Wi-Fi and Bluetooth, AOP, SmartIO and VXD firmware.

[support]
status = "experimental"
tested_by = ["tompta1"]

# States: working, untested, missing, none (features.toml). "working" was seen on
# tompta1's J120 with his build (#205, November 2026); README lists what the
# integration changed since. "untested" means a driver binds in its device tree.
[features]
display = "working" # boot framebuffer (simpledrm)
screen_off = "missing"
backlight = "working"
gpu_desktop = "missing"
touch = "working" # apple_z2 K1, K1F18,3
buttons = "working" # Power and Home; the Smart Cover is now a D2400 GPIO key, untested
accelerometer = "working" # AOP
gyroscope = "untested"
light_sensor = "missing" # two CT709 on I2C3; driver not merged yet (README)
touch_id = "missing"
storage_read = "working"
storage_write = "working" # tompta1 installed to and booted from internal storage
wifi = "working" # BCM4355 C0 on PCIe port 2
bluetooth_input = "working"
bluetooth_audio = "working"
cellular = "none"
battery = "working" # BQ27540 on UART5 HDQ
charging = "untested" # the D2355 Tristar charger driver is not merged yet; the boot loader's input limit stays (README)
charging_control = "missing"
suspend = "working"
resume = "working"
usb_serial = "working"
usb_network = "working"
usb_host = "missing"
audio_output = "untested" # headphones (CS42L83 on MCA4); the four speakers are not merged yet (README)
audio_input = "working" # two PDM microphones
camera = "missing"
video_decode_hevc = "untested" # the VXD decodes H.264, as on the A10
