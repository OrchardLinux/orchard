# iPad 7 (Wi-Fi) — J171: hardware identity, boot assets and firmware recipe.
schema = 1
kind = "hardware.device"

[device]
profile = "j171"
name = "iPad 7 (Wi-Fi)"
apple_products = ["iPad7,11"]
dt_compatible = ["apple,j171"]

# BDID: ApBoardID/ApChipID of the j171ap identities in the 22H384 (iPadOS 18.7.11) BuildManifest.plist;
# cross-checked with api.ipsw.me/v4/device/iPad7,11 ("bdid").
[match.dfu]
chip = 0x8010
board = 0x1c

[boot]
methods = ["checkm8-pongo"]
# Not published yet: no j171 launcher release exists. Mirrors the j71b URL pattern.

[kernel]
platform = "apple-16k" # kernel/series/apple-16k, kernel/configs/apple-16k
dtb = "t8010-j171"     # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Relative to this device.toml; public recipe, not firmware bytes.

[support]
status = "experimental"

# States: working, untested, missing, none (features.toml).
[features]
# The display pipe driver adopts the boot framebuffer mode; translated scanout is untested.
display = "working"
screen_off = "untested"
backlight = "working"
touch = "working"
buttons = "working"
accelerometer = "working" # Needs apple/aop-ipad7c.bin from the firmware recipe; J171 2026-11-19 (#175)
gyroscope = "working" # Same AOP firmware as the accelerometer; J171 2026-11-19 (#175)
light_sensor = "working" # ct819: ~0 lux dark, ~1100 lux under a torch; J171 2026-11-17
touch_id = "missing"
storage_read = "working"
storage_write = "working"
wifi = "working"
bluetooth_input = "working" # BT game controller bonded, all inputs on evdev; J171 2026-11-12
bluetooth_audio = "working" # A2DP (AAC) BT earbud on a USI unit; vendor patch picked automatically with #164, linked by hand before it
cellular = "none"
battery = "working"
charging = "working" # DCP wall charger gets the 1500 mA grant (#179); other sources 500 mA; J171 2026-11-18
charging_control = "missing"
suspend = "working" # s2idle from Power button and idle, cable in and out; J171 2026-11-18 (#175, main 1b20c3e)
resume = "working" # Home wakes it, USB/NCM comes back; J171 2026-11-18
usb_serial = "untested"
usb_network = "working" # NCM gadget, DHCP and SSH from a Linux host in daily use
usb_host = "untested"
audio_output = "working"
audio_input = "working" # Both built-in microphones; needs the AOP firmware; J171 2026-11-19 (#175)
camera = "missing"
video_decode_hevc = "working" # v4l2slh265dec bit-exact against software, ~300 fps at 1080p; J171 2026-11-18 (#175)
