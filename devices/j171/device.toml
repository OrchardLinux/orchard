# iPad 7 (Wi-Fi) — J171: hardware identity, boot assets and firmware recipe.
schema = 1
kind = "hardware.device"

[device]
profile = "j171"
name = "iPad 7 (Wi-Fi)"
apple_products = ["iPad7,11"]
dt_compatible = ["apple,j171"]

# BDID: ApBoardID/ApChipID of the j171ap identities in the 22H384 (iPadOS 18.7.11) BuildManifest.plist;
# cross-checked with api.ipsw.me/v4/device/iPad7,11 ("bdid").
[match.dfu]
chip = 0x8010
board = 0x1c

[boot]
methods = ["checkm8-pongo"]
# Not published yet: no j171 launcher release exists. Mirrors the j71b URL pattern.

[kernel]
platform = "apple-16k" # kernel/series/apple-16k, kernel/configs/apple-16k
dtb = "t8010-j171"     # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Relative to this device.toml; public recipe, not firmware bytes.

[support]
status = "experimental"

# States: working, untested, missing, none (features.toml).
[features]
usb_host = "missing"
warm_restart = "untested"
display = "working"
screen_off = "untested"
backlight = "working"
touch = "working"
buttons = "working"
accelerometer = "untested"
gyroscope = "missing"
light_sensor = "untested"
touch_id = "missing"
storage_read = "working"
storage_write = "working"
wifi = "working"
bluetooth_input = "missing"
bluetooth_audio = "missing"
cellular = "none"
battery = "working"
charging = "untested"
charging_control = "missing"
suspend = "untested"
resume = "untested"
usb_serial = "untested"
usb_network = "untested"
audio_output = "working"
audio_input = "missing"
camera = "missing"
video_decode_hevc = "missing"
