# iPad 5 (Wi-Fi) (J71T, S8003 TSMC): hardware identity, boot assets and firmware recipe.
# iPad 5 support comes from Berkay Kösebay's port (brkosebay/omarchy-ipad5, OrchardLinux/hardware#6).
schema = 1
kind = "hardware.device"

[device]
profile = "j71t"
name = "iPad 5 (Wi-Fi)"
apple_products = ["iPad6,11"]
dt_compatible = ["apple,j71t"]

# BDID: ApChipID/ApBoardID of the j71tap identities in the 20H350 (iPadOS 16.7.10) BuildManifest.plist.
[match.dfu]
chip = 0x8003
board = 0x10

[boot]
methods = ["checkm8-pongo"]

[kernel]
platform = "apple-16k" # kernel/series/apple-16k, kernel/configs/apple-16k
dtb = "s8003-j71t"     # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Relative to this device.toml; public recipe, not firmware bytes.

[support]
status = "experimental"

# States: working, untested, missing, none (features.toml).
[features]
display = "working"
screen_off = "untested"
backlight = "working"
touch = "working"
buttons = "working"
accelerometer = "working"
gyroscope = "working"
light_sensor = "working"
touch_id = "missing"
storage_read = "working"
storage_write = "working"
wifi = "working"
bluetooth_input = "untested"
bluetooth_audio = "untested"
cellular = "none"
battery = "working"
charging = "working"
charging_control = "untested"
suspend = "untested"
resume = "untested"
usb_serial = "working"
usb_network = "working"
audio_output = "working"
audio_input = "working"
camera = "missing"

# Integration evidence: linux-a9 docs/release/orchard-prs-20261108-final/evidence.md.
# Charging cold/rebind: +1.1 to +1.4 A; one AOP-blacklisted warm boot stayed
# at 500 mA. Suspend, resume, Bluetooth input/audio and charging control untested.
