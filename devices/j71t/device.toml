# iPad 5 (Wi-Fi) (J71T, S8003 TSMC): hardware identity, boot assets and firmware recipe.
# iPad 5 support comes from Berkay Kösebay's port (brkosebay/omarchy-ipad5, OrchardLinux/hardware#6).
schema = 1
kind = "hardware.device"

[device]
profile = "j71t"
name = "iPad 5 (Wi-Fi)"
apple_products = ["iPad6,11"]
dt_compatible = ["apple,j71t"]

# BDID: ApChipID/ApBoardID of the j71tap identities in the 20H350 (iPadOS 16.7.10) BuildManifest.plist.
[match.dfu]
chip = 0x8003
board = 0x10

[boot]
methods = ["checkm8-pongo"]

[kernel]
platform = "apple-16k" # kernel/series/apple-16k, kernel/configs/apple-16k
dtb = "s8003-j71t"     # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Relative to this device.toml; public recipe, not firmware bytes.

[support]
status = "experimental"

# States: working, untested, missing, none (features.toml).
[features]
# Display DART/SMMU pattern CRC and imported-plane scanout verified on J71t.
display = "working"
screen_off = "working" # Smart Cover turns the screen off and wakes it (#118); panel supply off in sleep (#170)
backlight = "working" # 1573 -> 1023 of 2047, dimming seen (#28)
touch = "working" # 30 s drag: 12600 events, none dropped (#28); after every wake (#168)
buttons = "working" # Power sleeps and wakes (#168, #170); Home and volume not reported
accelerometer = "working"
gyroscope = "working"
light_sensor = "working"
touch_id = "missing"
storage_read = "working" # NVMe reads, no timeouts (#28)
storage_write = "working" # orchard install from DFU, then cold and warm boots (#118, #124)
wifi = "working" # WPA, DHCP, ping (#28); after every wake (#168)
bluetooth_input = "working" # DualShock 4 in games (omarchy-a#65)
bluetooth_audio = "untested"
cellular = "none"
battery = "working" # 85 %, 4.109 V, -161 mA (#28)
charging = "working" # 2400 mA grant held through CPU and GPU load and sleep (#167, #168)
charging_control = "working" # source grant negotiated and kept (#167)
suspend = "working" # RTC, Power, idle and Smart Cover sleeps (#168, #170)
resume = "working" # NVMe, Wi-Fi, touch, rotation, Bluetooth, GPU and USB after every wake (#168)
usb_serial = "working"
usb_network = "working"
usb_host = "working"
audio_output = "working"
audio_input = "untested"
camera = "missing"
video_decode_hevc = "working"
