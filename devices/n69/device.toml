# iPhone SE (S8003) (N69): identity from public sources
# (tools/catalog/generate). Storage, touch and light sensor as on the N66; see docs/device-bring-up.md.
schema = 1
kind = "hardware.device"

[device]
profile = "n69"
name = "iPhone SE (S8003)"
short_name = "iPhone SE"
apple_products = ["iPhone8,4"]
dt_compatible = ["apple,n69"]

[match.dfu]
chip = 0x8003
board = 0x02

[boot]
methods = ["checkm8-pongo"] # palera1n's device list (palera.in); not run with Orchard yet.

[kernel]
platform = "apple-16k"
dtb = "s8003-n69" # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Pins this board's public IPSW; makes the touchscreen, VXD and AOP firmware, and the GPU firmware from the iPad 5's iPadOS 16.7.10.

[support]
status = "experimental"

# States: working, untested, missing, none (features.toml). Nothing here has run on
# this board with Orchard: "untested" means a driver binds in its device tree
# (tools/catalog/drivers.json), plus the display's boot console.
[features]
display = "untested"
screen_off = "untested" # Display pipe on for every A9 board; the DSI link stays powered
backlight = "untested"
gpu_desktop = "untested"
touch = "untested"
buttons = "untested"
accelerometer = "untested" # AOP with aopfw-s8000aop; mount matrix measured on the N66 (shared s800x-iphone.dtsi)
gyroscope = "untested"
light_sensor = "untested"
touch_id = "missing"
storage_read = "untested"
storage_write = "untested"
wifi = "missing" # Different chip from the 6s and 6s Plus: a BCM4345 ("hans" module) on PCIe port 1 (ADT pci-bridge1 wlan-pcie,bcm4345); not described, and its firmware is not in the recipe
bluetooth_input = "missing" # The BCM4345 module's Bluetooth on UART1 (power on D2255 GPIO 8 as on the 6s); not described, and its Patchram is not in the recipe
bluetooth_audio = "missing" # Same as Bluetooth input
cellular = "missing"
battery = "untested" # bq27540 gauge on uart5 behind the SN2400's HDQ mux
charging = "untested" # SN2400 charger
charging_control = "missing" # The SN2400 driver has no writable limit yet
suspend = "untested"
resume = "untested"
usb_serial = "untested"
usb_network = "untested"
usb_host = "missing" # Needs the Tristar VBUS path on the iPhone's Antigua PMU; only the iPad 5's D2365 one exists
audio_output = "missing" # No Linux driver for the CS42L71 codec
audio_input = "missing" # No Linux driver for the CS42L71 codec
camera = "missing"
video_decode_hevc = "untested" # VXD on for every A9; vxd-deva.bin from the recipe
