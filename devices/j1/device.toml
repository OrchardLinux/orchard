# iPad 3 (Wi-Fi) (J1): identity, kernel and manual boot prerequisites.
schema = 1
kind = "hardware.device"

[device]
profile = "j1"
name = "iPad 3 (Wi-Fi)"
apple_products = ["iPad3,1"]
dt_compatible = ["apple,j1ap"]

[match.dfu]
chip = 0x8945
board = 0x00

[boot]
methods = ["jailbreak-kdfu"]
entries = ["kdfu"]
# Booted from a jailbroken iOS 9.3.5 with kloader and Cascadia's staging
# loader (README.md); orchard's launcher does not run this chain yet.

[kernel]
platform = "apple-armv7"  # kernel/series/apple-armv7, kernel/configs/apple-armv7
dtb = "s5l8945x-j1"       # arch/arm/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json"

[support]
status = "experimental"

# States: working, untested, missing, none (features.toml).
# "untested": these ran on 2026-11-06 with orchard's patch series and DTB, built
# with GCC 11.4 and the boot kit's config (README.md), but orchard's own clang
# build has not booted on a J1 yet.
[features]
display = "untested" # simplefb on iBoot's scanout; a userspace dashboard drew to fb0 on the LCD.
screen_off = "missing"
backlight = "missing"
touch = "untested" # Z2 bootload from userspace, then multitouch contacts on event0.
buttons = "missing"
accelerometer = "missing"
gyroscope = "missing"
light_sensor = "missing"
touch_id = "none"
storage_read = "missing"
storage_write = "missing"
wifi = "untested" # Joined WPA2 on 5 GHz and held a DHCP lease past 5 min; second USB complex brought up from userspace.
bluetooth_input = "missing"
bluetooth_audio = "missing"
cellular = "none"
battery = "missing"
charging = "missing"
charging_control = "missing"
suspend = "missing"
resume = "missing"
# The P105 USB topic preserves legacy tuning; its shared gate helper needs a J1 regression boot.
usb_serial = "untested" # Root shell on ttyGS0.
usb_network = "untested" # CDC Ethernet, pinged both ways.
audio_output = "missing"
audio_input = "missing"
camera = "missing"
video_decode_hevc = "missing"
