# iPad 6 Wi-Fi (J71b): hardware identity, boot assets and firmware recipe.
schema = 1
kind = "hardware.device"

[device]
profile = "j71b"
name = "iPad 6 (Wi-Fi)"
apple_products = ["iPad7,5"]
dt_compatible = ["apple,j71b"]

[match.dfu]
chip = 0x8010
board = 0x18

[boot]
methods = ["checkm8-pongo"]

[kernel]
platform = "apple-16k" # kernel/series/apple-16k, kernel/configs/apple-16k
dtb = "t8010-j71b"     # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Relative to this device.toml; public recipe, not firmware bytes.

[support]
status = "supported"

# States: working, untested, missing, none (features.toml).
[features]
display = "working"
screen_off = "working"
backlight = "working"
touch = "working"
buttons = "working" # Power, Home and volume keys in daily use on the desktop.
accelerometer = "working"
gyroscope = "missing"
light_sensor = "missing"
touch_id = "missing"
storage_read = "working"
storage_write = "working"
wifi = "working"
bluetooth_input = "working"
bluetooth_audio = "working"
cellular = "none"
battery = "working"
charging = "working"
charging_control = "working"
suspend = "working"
resume = "working"
usb_serial = "working"
usb_network = "working"
audio_output = "working"
audio_input = "missing"
camera = "missing"
