# iPad Air (Wi-Fi) (J71): identity from public sources
# (tools/catalog/generate). In its platform's kernel, no bring-up yet; see docs/device-bring-up.md.
schema = 1
kind = "hardware.device"

[device]
profile = "j71"
name = "iPad Air (Wi-Fi)"
apple_products = ["iPad4,1"]
dt_compatible = ["apple,j71"]

[match.dfu]
chip = 0x8960
board = 0x10

[boot]
methods = ["checkm8-pongo"] # checkra1n -> PongoOS -> m1n1, J71 2026-11-24
entries = ["checkra1n"]

[kernel]
platform = "apple-4k"
dtb = "s5l8960x-j71" # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Pins this board's public IPSW; converts nothing until bring-up needs it.

[support]
status = "experimental"
tested_by = ["ricktav"] # #230

# States: working, untested, missing, none (features.toml). "working" was seen on this
# board (ricktav, 2026-11-24); "untested" means a driver binds in its device tree
# (tools/catalog/drivers.json) but it has not been shown to work here.
[features]
display = "working" # simple framebuffer 1536x2048, console and the Omarchy desktop; installed Omarchy A, kernel main eab974c plus test patches, J71 2026-11-24
screen_off = "untested" # Omarchy A darkens it by brightness 0 (omarchy-powerd), the RAM payloads by bl_power 4; both reach apple_pmic_bl at PMIC 0x600, the node air1.dtsi shares with the J72, where screen off and wake work (#232). Not yet seen on this board
backlight = "working" # PMIC backlight, brightness from the Omarchy menu (1412/2047 at 60 %); installed Omarchy A, kernel main eab974c plus test patches, J71 2026-11-24
gpu_desktop = "missing"
touch = "untested" # N1 on SPI2 with the J72 path reports contacts in Omarchy, but after 5-40 min it logs "J72 touch stopped after error -71" and stays off until apple-z2 is rebound; installed Omarchy A, kernel main eab974c plus test patches, J71 2026-11-24. Still so with the released linux-orchard-apple-4k 0.3.8-1 and omarchy-a 0.3.6, no test patches: stopped 351 s after boot, J71 2026-11-26
buttons = "working" # gpio-keys: Home wakes from s2idle, the side switch reports KEY_MUTE; installed Omarchy A, kernel main eab974c plus test patches, J71 2026-11-24; again on the released linux-orchard-apple-4k 0.3.8-1 and omarchy-a 0.3.6, J71 2026-11-26: volume up and down change the level
accelerometer = "missing"
gyroscope = "missing"
light_sensor = "working" # CT819 at 0x39 on i2c3 (ADT als-i2c0/als-i2c3, probe-for-hardware) with tsl2583: raw 0 covered, 97 dim, 22133 under a lamp; uncalibrated lux, the ADT carries no LSCI; J71 2026-11-24, a7/cover-als a7b4561 and ba2e3c4 RAM boots; again on the released linux-orchard-apple-4k 0.3.8-1 and omarchy-a 0.3.6, J71 2026-11-26, installed: the reading drops when the sensor is covered
touch_id = "missing"
storage_read = "working" # asp on the ANS with ans_dll always-on (#221): the installed system boots and runs from storage; first read 0.13 s in a RAM boot; installed Omarchy A, kernel main eab974c plus test patches, J71 2026-11-24
storage_write = "working" # Omarchy A installed and running from storage on main eab974c plus #230 (ricktav, 2026-11-24)
wifi = "working" # BCM43241 on HSIC (apple-a7-wlan + brcmfmac): NetworkManager connects, SSH over Wi-Fi; installed Omarchy A, kernel main eab974c plus test patches, J71 2026-11-24
bluetooth_input = "missing"
bluetooth_audio = "missing"
cellular = "none" # Wi-Fi model (iPad4,1); the cellular J72 is a separate board
battery = "working" # BQ2754x on UART5 HDQ: capacity, voltage, current, temperature and cycle count; installed Omarchy A, kernel main eab974c plus test patches, J71 2026-11-24
charging = "working" # Apple USB-C charger seen as Type-C 1.5 A: +0.8 to +1 A into the battery with the desktop up at 60 % backlight; a Mac CDP port gave 1.35 A at 4.5 V (D2089 ADC), not enough at full backlight; installed Omarchy A, kernel main eab974c plus test patches, J71 2026-11-24; again on the released linux-orchard-apple-4k 0.3.8-1 and omarchy-a 0.3.6, J71 2026-11-26, on a Mac port (CDP): the grant stays at the 500 mA fallback while the pack is above 40.0 C ("battery outside the charging window"); at 40.9 C under full CPU load it discharged at 2 A while plugged in
charging_control = "working" # source identified at each plug (CDP, Type-C 1.5 A), grant ramped 100 -> 1500 mA, as logged with D2089 ADC telemetry in a RAM boot of main eab974c plus a logging patch; J71 2026-11-24
suspend = "working" # s2idle from Omarchy, many rounds; it is not low-power yet: 61 % to 0 in about 14 h asleep on a Mac port; installed Omarchy A, kernel main eab974c plus test patches, J71 2026-11-24; again on the released linux-orchard-apple-4k 0.3.8-1 and omarchy-a 0.3.6, J71 2026-11-26
resume = "working" # Home wakes it; ANS back with 0 busy tags, Wi-Fi, USB and touch back; installed Omarchy A, kernel main eab974c plus test patches, J71 2026-11-24; again on the released linux-orchard-apple-4k 0.3.8-1 and omarchy-a 0.3.6, J71 2026-11-26: Wi-Fi, USB and touch back
usb_serial = "working" # ttyACM over the Lightning port: orchard exec in RAM boots; J71 2026-11-24
usb_network = "working" # CDC NCM: SSH to the installed system at 172.16.42.1; installed Omarchy A, kernel main eab974c plus test patches, J71 2026-11-24
usb_host = "missing"
audio_output = "working" # CS42L81 speakers on SPI3 + MCA0; "iPad Air Speakers" card came up and a browser game played through the speakers, with MCA0's interrupt left alone (#230, installed Omarchy A, J71 2026-11-24). After s2idle a browser tab stayed silent until reloaded; again on the released linux-orchard-apple-4k 0.3.8-1 and omarchy-a 0.3.6, J71 2026-11-26: both speakers play, also after s2idle
audio_input = "missing"
camera = "missing"
video_decode_hevc = "missing"
