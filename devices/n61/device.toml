# iPhone 6 (N61AP): experimental A8 RAM-boot recipe.
schema = 1
kind = "hardware.device"

[device]
profile = "n61"
name = "iPhone 6"
apple_products = ["iPhone7,2"]
dt_compatible = ["apple,n61"]

# Observed on N61AP in DFU; T7000 identifies itself as CPID 7000.
[match.dfu]
chip = 0x7000
board = 0x06

[boot]
methods = ["checkm8-pongo"]

[kernel]
platform = "apple-4k"
dtb = "t7000-n61"

# The RAM shell uses public components; touch firmware is extracted privately.
[firmware]
recipe = "firmware.json" # The GPU firmware comes from the iPod touch 6's iOS 12.4 (16G77), the tested one.

[support]
status = "experimental"
tested_by = ["amethyst-oak"] # issue #61

# States: working, untested, missing, none (features.toml).
[features]
display = "working" # The minimal-boot framebuffer console was visible on the LCD.
screen_off = "untested"
backlight = "untested"
gpu_desktop = "untested"
touch = "working" # Taps and swipes produced raw evdev contacts/releases in minimal-boot.
buttons = "untested"
accelerometer = "missing"
gyroscope = "missing"
light_sensor = "missing"
touch_id = "missing"
storage_read = "untested" # ANS1 on every A8 board (t7000-common.dtsi), as on the N102
storage_write = "untested" # Same ANS1 and asp driver as the N102
wifi = "untested" # BCM4345 module shared with the N102 (t7000-bcm4345.dtsi), module tempranillo
bluetooth_input = "untested" # Patchram follows the Wi-Fi module vendor (MUR/TDK/USI)
bluetooth_audio = "untested"
cellular = "missing"
battery = "untested" # bq27xxx over HDQ (W1_MASTER_UART); the ADT gauge matches the iPad mini 4's.
charging = "missing"
charging_control = "missing"
suspend = "untested"
resume = "untested"
usb_serial = "working"
usb_network = "untested"
usb_host = "missing"
audio_output = "missing"
audio_input = "missing"
camera = "missing"
video_decode_hevc = "missing"
