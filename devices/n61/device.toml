# iPhone 6 (N61AP): experimental A8 RAM-boot recipe.
schema = 1
kind = "hardware.device"

[device]
profile = "n61"
name = "iPhone 6"
apple_products = ["iPhone7,2"]
dt_compatible = ["apple,n61"]

# Observed on N61AP in DFU; T7000 identifies itself as CPID 7000.
[match.dfu]
chip = 0x7000
board = 0x06

[boot]
methods = ["checkm8-pongo"]

[kernel]
platform = "apple-4k"
dtb = "t7000-n61"

# The RAM shell uses public components; touch firmware is extracted privately.
[firmware]
recipe = "firmware.json"

[support]
status = "experimental"

# States: working, untested, missing, none (features.toml).
[features]
display = "working" # The minimal-boot framebuffer console was visible on the LCD.
screen_off = "untested"
backlight = "untested"
touch = "working" # Taps and swipes produced raw evdev contacts/releases in minimal-boot.
buttons = "untested"
accelerometer = "missing"
gyroscope = "missing"
light_sensor = "missing"
touch_id = "missing"
storage_read = "missing"
storage_write = "missing"
wifi = "missing"
bluetooth_input = "missing"
bluetooth_audio = "missing"
cellular = "missing"
battery = "untested" # bq27xxx over HDQ (W1_MASTER_UART); the ADT gauge matches the iPad mini 4's.
charging = "missing"
charging_control = "missing"
suspend = "untested"
resume = "untested"
usb_serial = "working"
usb_network = "untested"
audio_output = "missing"
audio_input = "missing"
camera = "missing"
