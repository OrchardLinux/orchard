# iPhone 6 (N61AP): experimental A8 RAM-boot recipe.
schema = 1
kind = "hardware.device"

[device]
profile = "n61"
name = "iPhone 6"
apple_products = ["iPhone7,2"]
dt_compatible = ["apple,n61"]

# Observed on N61AP in DFU; T7000 identifies itself as CPID 7000.
[match.dfu]
chip = 0x7000
board = 0x06

[boot]
methods = ["checkm8-pongo"]

[kernel]
platform = "apple-4k"
dtb = "t7000-n61"

# The RAM shell uses public components; touch firmware is extracted privately.
[firmware]
recipe = "firmware.json" # The GPU firmware comes from this board's pinned IPSW.

[support]
status = "experimental"
tested_by = ["amethyst-oak", "jeroentrappers", "tcballard"] # issue #61; GPU in #196; hardware-check + SN2400 battery/charging 2026-11-28

# States: working, untested, missing, none (features.toml).
[features]
display = "working" # The minimal-boot framebuffer console was visible on the LCD; 750x1334 apple-adbe DSI-1 in RAM hardware-check (2026-11-28).
screen_off = "untested"
backlight = "working" # 20e200010.backlight dimmed to 511/2047 and restored to 1545/2047 (RAM hardware-check 2026-11-28)
gpu_desktop = "untested" # GPU driver, Vulkan and GPU buffers on the display pass here (jeroentrappers, #196); the desktop itself not yet run on the GPU
touch = "working" # Taps and swipes produced raw evdev contacts/releases in minimal-boot.
buttons = "untested"
accelerometer = "missing"
gyroscope = "missing"
light_sensor = "missing"
touch_id = "missing"
storage_read = "working" # ANS1 asp0n1 (64 GB), 1 GiB read in 3 s, all namespaces read-only, no faults (RAM hardware-check 2026-11-28)
storage_write = "untested" # Same ANS1 and asp driver as the N102
wifi = "working" # BCM4345/5 (tempranillo): firmware loads, scan finds 13 networks, WPA2 associates, DHCP + gateway ping 0% loss (RAM hardware-check 2026-11-28)
bluetooth_input = "untested" # BCM4345B0 hci0 binds and loads BCM.apple,n61-TDK.hcd (build 2399); pairing untested
bluetooth_audio = "untested"
cellular = "missing"
battery = "working" # bq27540 over HDQ behind the SN2400's mux; live capacity, voltage, current and temperature (tcballard, OrchardLinux/linux#18)
charging = "working" # SN2400 charger: follows the USB host's grant and the battery temperature; charged at 500 mA on a Linux host port (tcballard, OrchardLinux/linux#18); a wall adapter is untested
charging_control = "missing" # The SN2400 driver has no writable limit yet
suspend = "untested"
resume = "untested"
usb_serial = "working"
usb_network = "working" # usb0 (172.16.42.1/30) up in RAM hardware-check (2026-11-28)
usb_host = "missing"
audio_output = "missing"
audio_input = "missing"
camera = "missing"
video_decode_hevc = "missing"
