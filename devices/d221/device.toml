# iPhone X (GSM) — D221: hardware identity, boot assets and firmware recipe.
schema = 1
kind = "hardware.device"

[device]
profile = "d221"
name = "iPhone X (GSM)"
apple_products = ["iPhone10,6"]
dt_compatible = ["apple,d221"]

# BDID: read from the unit's DFU serial string (CPID:8015 BDID:0E), cross-checked
# against the d221ap identity in the 20H392 BuildManifest.plist.
# 0x0e is also the d111 (A10) board, so chip and board are matched together.
[match.dfu]
chip = 0x8015
board = 0x0e

# Orchard Recovery runs here (USB "Orchard Recovery", serial BOARD:<profile>).
[match.linux]
recovery = true

[boot]
methods = ["checkm8-pongo"]
# Not published yet: no d221 launcher release exists. Mirrors the j71b URL pattern.

[kernel]
platform = "apple-16k" # kernel/series/apple-16k, kernel/configs/apple-16k
dtb = "t8015-d221"     # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Relative to this device.toml; public recipe, not firmware bytes.

[support]
status = "experimental"

# States: working, untested, missing, none (features.toml).
[features]
display = "working"
screen_off = "working" # apple_dsi_bl: bl_power off sends DBV 0, the panel goes dark; on restores the level.
backlight = "working" # apple_dsi_bl: DCS 0x51 to the OLED panel (docs/bring-up/d221-backlight.md).
touch = "working" # apple_hidspi_ts: firmware from the recipe, calibration from the ADT (docs/bring-up/d221-touch.md).
buttons = "working" # macsmc-input: volume, side button, ring/silent switch.
accelerometer = "missing"
gyroscope = "missing"
light_sensor = "missing"
touch_id = "none"
storage_read = "working"
storage_write = "working" # nvme-apple binds; reads and partition writes tested from the recovery; no clean install yet.
wifi = "untested"
bluetooth_input = "missing"
bluetooth_audio = "missing"
cellular = "missing"
battery = "working" # macsmc-power; charge_now reads negative.
charging = "missing"
charging_control = "missing"
suspend = "missing"
resume = "missing"
usb_serial = "working"
usb_network = "untested"
audio_output = "missing"
audio_input = "missing"
camera = "missing"
