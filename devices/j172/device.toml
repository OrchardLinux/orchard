# iPad 7 (Cellular) — J172: hardware identity, boot assets and firmware recipe.
schema = 1
kind = "hardware.device"

[device]
profile = "j172"
name = "iPad 7 (Cellular)"
apple_products = ["iPad7,12"]
dt_compatible = ["apple,j172"]

# BDID: ApBoardID/ApChipID of the j172ap identities in the 22H384 (iPadOS 18.7.11) BuildManifest.plist;
# cross-checked with api.ipsw.me/v4/device/iPad7,12 ("bdid").
[match.dfu]
chip = 0x8010
board = 0x1e

[boot]
methods = ["checkm8-pongo"]
# Not published yet: no j172 launcher release exists. Mirrors the j71b URL pattern.

[kernel]
platform = "apple-16k" # kernel/series/apple-16k, kernel/configs/apple-16k
dtb = "t8010-j172"     # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Relative to this device.toml; public recipe, not firmware bytes.

[support]
status = "experimental"

# States: working, untested, missing, none (features.toml).
[features]
display = "untested"
screen_off = "untested"
backlight = "untested"
touch = "untested"
buttons = "untested"
accelerometer = "untested"
gyroscope = "untested"
light_sensor = "untested"
touch_id = "missing"
storage_read = "untested"
storage_write = "untested"
wifi = "untested"
bluetooth_input = "missing"
bluetooth_audio = "missing"
cellular = "missing"
battery = "untested"
charging = "untested"
charging_control = "missing"
suspend = "untested"
resume = "untested"
usb_serial = "untested"
usb_network = "untested"
usb_host = "untested"
audio_output = "untested"
audio_input = "untested" # PDM controller, both built-in microphones
camera = "missing"
video_decode_hevc = "untested"
