# iPad mini 2 (Cellular) (J86): identity from public sources
# (tools/catalog/generate). In its platform's kernel, no bring-up yet; see docs/device-bring-up.md.
schema = 1
kind = "hardware.device"

[device]
profile = "j86"
name = "iPad mini 2 (Cellular)"
apple_products = ["iPad4,5"]
dt_compatible = ["apple,j86"]

[match.dfu]
chip = 0x8960
board = 0x0c

[boot]
methods = ["checkm8-pongo"] # checkra1n's device list (checkra.in); not run on this board with Orchard yet.
entries = ["checkra1n"]

[kernel]
platform = "apple-4k"
dtb = "s5l8960x-j86" # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Pins this board's public IPSW; converts nothing until bring-up needs it.

[support]
status = "experimental"
tested_by = ["perryraskin"] # #66

# States: working, untested, missing, none (features.toml). Nothing here has run on
# this board with Orchard: "untested" means a driver binds in its device tree
# (tools/catalog/drivers.json), plus the display's boot console.
[features]
display = "working" # Omarchy A desktop on the panel; installed Omarchy A, perryraskin, J86 iOS 12.5.8 2026-11-26 (#66)
screen_off = "untested" # backlight off through apple_pmic_bl (PMIC 0x600, mini2.dtsi), as on the J72 (#232)
backlight = "untested"
gpu_desktop = "missing"
touch = "working" # N1 touch works in Omarchy A; installed Omarchy A, perryraskin, J86 iOS 12.5.8 2026-11-26 (#66)
buttons = "untested"
accelerometer = "untested" # apple-oscar on the M7 (UART4), as on the J71 where it works; same ADT wiring
gyroscope = "untested" # apple-oscar on the M7 (UART4); not mapped or used on any board yet
light_sensor = "untested" # CT819 on i2c3 (ADT i2c3/als) with tsl2583, calibrated by the LSCI v2 record m1n1 copies; not yet run on this board
touch_id = "missing"
storage_read = "working" # the installed system boots and runs from storage; installed Omarchy A, perryraskin, J86 iOS 12.5.8 2026-11-26 (#66)
storage_write = "working" # Omarchy A installed to storage; installed Omarchy A, perryraskin, J86 iOS 12.5.8 2026-11-26 (#66)
wifi = "working" # BCM43241 connects with nmcli; installed Omarchy A, perryraskin, J86 iOS 12.5.8 2026-11-26 (#66)
bluetooth_input = "missing"
bluetooth_audio = "missing"
cellular = "missing"
battery = "untested" # BQ2754x on UART5 HDQ, as on every A7 iPad (ADT uart5/gas-gauge), with the J72 gauge profile; not yet run on this board
charging = "working" # charges; installed Omarchy A, perryraskin, J86 iOS 12.5.8 2026-11-26 (#66)
charging_control = "untested" # as on the J72: source identified at each plug, grant ramped, back to 100 mA on unplug; not yet run on this board
suspend = "working" # sleep from Omarchy A; installed Omarchy A, perryraskin, J86 iOS 12.5.8 2026-11-26 (#66)
resume = "working" # wakes from sleep; installed Omarchy A, perryraskin, J86 iOS 12.5.8 2026-11-26 (#66)
usb_serial = "untested"
usb_network = "working" # orchard shell to the installed system over USB; installed Omarchy A, perryraskin, J86 iOS 12.5.8 2026-11-26 (#66)
usb_host = "missing"
audio_output = "working" # speakers play; installed Omarchy A, perryraskin, J86 iOS 12.5.8 2026-11-26 (#66)
audio_input = "missing"
camera = "missing"
video_decode_hevc = "none" # the A7 decoder is an H.264-generation VXD: Apple's device tree gives it vxd-version 4 and only an h264-playback-level, iOS 12.5.8 drives it with AppleVXD393, and Apple's HEVC rule (AppleD5500) takes vxd-version 7, 9 and 10 only
