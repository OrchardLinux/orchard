# iPad Air 2 (Cellular) — J82: hardware identity, boot assets and firmware recipe.
# iPad Air 2 support comes from Martin Puškáč's port (mattonik/ipad-nixos), handed to Orchard
# by micro23 (micro23/ipadair2-omarchy).
schema = 1
kind = "hardware.device"

[device]
profile = "j82"
name = "iPad Air 2 (Cellular)"
apple_products = ["iPad5,4"]
dt_compatible = ["apple,j82"]

# BDID: ApChipID/ApBoardID of the j82ap identities in the 19H422 (iPadOS 15.8.8) BuildManifest.plist.
[match.dfu]
chip = 0x7001
board = 0x02

[boot]
methods = ["checkm8-pongo"]

[kernel]
platform = "apple-4k"  # kernel/series/apple-4k, kernel/configs/apple-4k: A8X has no 16 KiB pages
dtb = "t7001-j82"       # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Relative to this device.toml; public recipe, not firmware bytes.

[support]
status = "experimental"

# States: working, untested, missing, none (features.toml).
[features]
display = "untested"
screen_off = "untested"
backlight = "untested"
gpu_desktop = "missing"
touch = "untested"
buttons = "untested"
accelerometer = "missing"
gyroscope = "missing"
light_sensor = "untested" # CT819 on i2c2 at 0x49 or 0x29 (ADT als1/als2, probe-for-hardware, as on the J81) with tsl2583, calibrated by the LSCI record m1n1 copies; not yet run on this board
touch_id = "missing"
storage_read = "untested" # ANS1 and asp as on the J81, whose storage reads and writes; its device tree enables them; not yet run on this board
storage_write = "untested" # same ANS1 and asp driver as the J81; not yet run on this board
wifi = "untested"
bluetooth_input = "untested"
bluetooth_audio = "untested"
cellular = "missing"
battery = "untested"
charging = "untested" # Shared iPad Air 2 Lightning charger (t7001-air2.dtsi)
charging_control = "untested" # Same charger driver as the J81
suspend = "untested"
resume = "untested"
usb_serial = "untested"
usb_network = "untested"
usb_host = "missing"
audio_output = "untested" # Shared iPad Air 2 speaker path; SmartIO firmware now in the recipe
audio_input = "missing"
camera = "missing"
video_decode_hevc = "missing"
