# iPad Air 2 (Cellular) — J82: hardware identity, boot assets and firmware recipe.
# iPad Air 2 support comes from Martin Puškáč's port (mattonik/ipad-nixos), handed to Orchard
# by micro23 (micro23/ipadair2-omarchy).
schema = 1
kind = "hardware.device"

[device]
profile = "j82"
name = "iPad Air 2 (Cellular)"
apple_products = ["iPad5,4"]
dt_compatible = ["apple,j82"]

# BDID: ApChipID/ApBoardID of the j82ap identities in the 19H422 (iPadOS 15.8.8) BuildManifest.plist.
[match.dfu]
chip = 0x7001
board = 0x02

[boot]
methods = ["checkm8-pongo"]

[kernel]
platform = "apple-4k"  # kernel/series/apple-4k, kernel/configs/apple-4k: A8X has no 16 KiB pages
dtb = "t7001-j82"       # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Relative to this device.toml; public recipe, not firmware bytes.

[support]
status = "experimental"

# States: working, untested, missing, none (features.toml).
[features]
warm_restart = "untested"
display = "untested"
screen_off = "untested"
backlight = "untested"
touch = "untested"
buttons = "untested"
accelerometer = "missing"
gyroscope = "missing"
light_sensor = "missing"
touch_id = "missing"
storage_read = "missing"
storage_write = "missing"
wifi = "untested"
bluetooth_input = "untested"
bluetooth_audio = "untested"
cellular = "missing"
battery = "untested"
charging = "missing"
charging_control = "missing"
suspend = "untested"
resume = "untested"
usb_serial = "untested"
usb_network = "untested"
audio_output = "missing"
audio_input = "missing"
camera = "missing"
video_decode_hevc = "missing"
