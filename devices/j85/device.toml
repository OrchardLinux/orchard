# iPad mini 2 (Wi-Fi) (J85): identity from public sources
# (tools/catalog/generate). Bring-up in progress; see docs/device-bring-up.md.
schema = 1
kind = "hardware.device"

[device]
profile = "j85"
name = "iPad mini 2 (Wi-Fi)"
apple_products = ["iPad4,4"]
dt_compatible = ["apple,j85"]

[match.dfu]
chip = 0x8960
board = 0x0a

[boot]
methods = ["checkm8-pongo"] # checkra1n's device list (checkra.in); Orchard RAM boots through checkra1n/Pongo on a J85 (2026-11-22)
entries = ["checkra1n"]

[kernel]
platform = "apple-4k"
dtb = "s5l8960x-j85" # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Pins this board's public IPSW; converts nothing until bring-up needs it.

[support]
status = "experimental"
tested_by = ["ricktav"]

# States: working, untested, missing, none (features.toml). "working" was seen on a
# J85; "untested" means a driver binds in its device tree (tools/catalog/drivers.json),
# plus the display's boot console.
[features]
display = "working" # simple framebuffer 1536x2048, console and Omarchy; J85 2026-11-23, main 5d0c610 RAM boot and installed Omarchy
screen_off = "missing"
backlight = "working" # PMIC backlight, brightness control in Omarchy; installed Omarchy J85 2026-11-23
gpu_desktop = "missing"
touch = "working" # apple_z2 N1 (C1F14,3) on SPI1: boots at every boot and reports contacts, RAM boot and installed Omarchy; J85 2026-11-22; main 5d0c610 RAM boot 2026-11-23
buttons = "working" # gpio-keys Power and Home; Home wakes from s2idle; J85 2026-11-23, main 5d0c610 RAM boot
accelerometer = "missing"
gyroscope = "missing"
light_sensor = "working" # CT819 on i2c3 (ADT i2c3/als) with tsl2583 and the LSCI v2 record m1n1 copies through als0 (72 bytes in a 200-byte property): "loaded LSCI v2 ambient-light calibration", 29 lux in a dim room; raw 9 to 8361 with the light; J85 2026-11-24, a7/cover-als ba2e3c4 RAM boot
touch_id = "missing"
storage_read = "working" # asp on the ANS: probe in 0.1 s, all namespaces and asp0n1p1-p3, direct reads before and after two s2idle rounds; J85 2026-11-23, main 5d0c610 RAM boot
storage_write = "untested" # same ANS and asp driver as the J72; not yet run on this board
wifi = "working" # BCM43241 on HSIC (apple-a7-wlan + brcmfmac USB, firmware 6.46.79): scans in a RAM boot; installed Omarchy: orchard-a7-wifi.service starts it, NetworkManager connects; J85 2026-11-22; main 5d0c610 RAM boot scans 2026-11-23
bluetooth_input = "missing"
bluetooth_audio = "missing"
cellular = "missing"
battery = "working" # BQ2754x on UART5 HDQ: capacity, voltage, current and temperature; J85 2026-11-23, main 5d0c610 RAM boot
charging = "working" # Mac USB-C port as CDP: 1050 mA, battery charging +478 mA with the screen on (J85 2026-11-23, main 5d0c610 RAM boot); at the 1500 mA maximum a CDP port charged it at +958 mA and a USB-C source got 1500 mA, on an earlier series with the same charger data (J85 2026-11-23)
charging_control = "working" # source identified (CDP) at boot and after each resume, the limit ramped back to 1050 mA; PMU line and ADC done (event 89) interrupts fire; J85 2026-11-23, main 5d0c610 RAM boot
suspend = "working" # s2idle via /sys/power/state, two rounds; read-only test, no writes in flight; J85 2026-11-23, main 5d0c610 RAM boot
resume = "working" # Home wakes it; ANS reads, charger and USB gadget come back; J85 2026-11-23, main 5d0c610 RAM boot
usb_serial = "working" # ttyACM over the Lightning port; J85 2026-11-23, main 5d0c610 RAM boot
usb_network = "working" # CDC NCM, SSH and HTTP over USB; J85 2026-11-23, main 5d0c610 RAM boot
usb_host = "missing"
audio_output = "untested" # both speakers played with #223's own driver (two CS35L19 on I2C2, MCA1 over SmartIO, browser playback under the MCA's -12 dB bound, left/right checked, survives suspend and resume; installed Omarchy, J85 2026-11-23); the shared CS35L19 driver and "iPad mini Speakers" card that landed have not run on it yet. The headphone jack (CS42L81) has no card yet
audio_input = "missing"
camera = "missing"
video_decode_hevc = "missing"
