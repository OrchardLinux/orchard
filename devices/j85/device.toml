# iPad mini 2 (Wi-Fi) (J85): identity from public sources
# (tools/catalog/generate). Bring-up in progress; see docs/device-bring-up.md.
schema = 1
kind = "hardware.device"

[device]
profile = "j85"
name = "iPad mini 2 (Wi-Fi)"
apple_products = ["iPad4,4"]
dt_compatible = ["apple,j85"]

[match.dfu]
chip = 0x8960
board = 0x0a

[boot]
methods = ["checkm8-pongo"] # checkra1n's device list (checkra.in); Orchard RAM boots through checkra1n/Pongo on a J85 (2026-11-22)
entries = ["checkra1n"]

[kernel]
platform = "apple-4k"
dtb = "s5l8960x-j85" # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Pins this board's public IPSW; converts nothing until bring-up needs it.

[support]
status = "experimental"
tested_by = ["ricktav"]

# States: working, untested, missing, none (features.toml). "working" was seen on a
# J85; "untested" means a driver binds in its device tree (tools/catalog/drivers.json),
# plus the display's boot console.
[features]
display = "untested"
screen_off = "missing"
backlight = "untested"
gpu_desktop = "missing"
touch = "working" # apple_z2 N1 (C1F14,3) on SPI1: boots at every boot and reports contacts, RAM boot and installed Omarchy; J85 2026-11-22
buttons = "untested"
accelerometer = "missing"
gyroscope = "missing"
light_sensor = "missing"
touch_id = "missing"
storage_read = "untested" # ANS (iop,s5l8960x) at the same address as on the J72, whose storage reads and writes with Orchard (ADT /arm-io/ans); not yet run on this board
storage_write = "untested" # same ANS and asp driver as the J72; not yet run on this board
wifi = "working" # BCM43241 on HSIC (apple-a7-wlan + brcmfmac USB, firmware 6.46.79): scans in a RAM boot; installed Omarchy: orchard-a7-wifi.service starts it, NetworkManager connects; J85 2026-11-22
bluetooth_input = "missing"
bluetooth_audio = "missing"
cellular = "missing"
battery = "untested" # BQ2754x on UART5 HDQ, as on every A7 iPad (ADT uart5/gas-gauge), with the J72 gauge profile; not yet run on this board
charging = "untested" # the shared A7 Tristar charger on the D2089 (ADT pmu,d2089 + tristar,cbtl1610), up to 1500 mA: a Mac's CDP port charged the battery at +958 mA and a USB-C source also got 1500 mA, on an earlier series with the same charger data; J85 2026-11-23
charging_control = "untested" # as on the J72: source identified at each plug, grant ramped, back to 100 mA on unplug; not yet run on this board
suspend = "untested"
resume = "untested"
usb_serial = "untested"
usb_network = "untested"
usb_host = "missing"
audio_output = "missing" # the speakers are two CS35L19 amplifiers on I2C2 + MCA1 (ADT i2c2/audio-speaker0/1), which have no driver
audio_input = "missing"
camera = "missing"
video_decode_hevc = "missing"
