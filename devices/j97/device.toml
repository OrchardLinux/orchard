# iPad mini 4 (Cellular) (J97): identity from public sources
# (tools/catalog/generate). In its platform's kernel, no bring-up yet; see docs/device-bring-up.md.
schema = 1
kind = "hardware.device"

[device]
profile = "j97"
name = "iPad mini 4 (Cellular)"
apple_products = ["iPad5,2"]
dt_compatible = ["apple,j97"]

[match.dfu]
chip = 0x7000
board = 0x0a

[boot]
methods = ["checkm8-pongo"] # palera1n's device list (palera.in); not run with Orchard yet.

[kernel]
platform = "apple-4k"
dtb = "t7000-j97" # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Pins this board's public IPSW; converts nothing until bring-up needs it.

[support]
status = "experimental"

# States: working, untested, missing, none (features.toml). Nothing here has run on
# this board with Orchard: "untested" means a driver binds in its device tree
# (tools/catalog/drivers.json), plus the display's boot console.
[features]
display = "untested"
screen_off = "missing"
backlight = "untested"
touch = "untested" # apple_z2 with the J96 data (C1F14,4): the ADT and mtprops match the J96's.
buttons = "untested"
accelerometer = "missing"
gyroscope = "missing"
light_sensor = "missing"
touch_id = "missing"
storage_read = "missing"
storage_write = "missing"
wifi = "untested" # BCM4350 over PCIe (brcmfmac), module zinfandelb; wired as on the J96.
bluetooth_input = "missing"
bluetooth_audio = "missing"
cellular = "missing"
battery = "untested" # bq27xxx over HDQ (W1_MASTER_UART), as on the J96.
charging = "missing"
charging_control = "missing"
suspend = "untested"
resume = "untested"
usb_serial = "untested"
usb_network = "untested"
audio_output = "missing"
audio_input = "missing"
camera = "missing"
video_decode_hevc = "missing"
