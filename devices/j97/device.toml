# iPad mini 4 (Cellular) (J97): identity from public sources
# (tools/catalog/generate). In its platform's kernel, no bring-up yet; see docs/device-bring-up.md.
schema = 1
kind = "hardware.device"

[device]
profile = "j97"
name = "iPad mini 4 (Cellular)"
apple_products = ["iPad5,2"]
dt_compatible = ["apple,j97"]

[match.dfu]
chip = 0x7000
board = 0x0a

[boot]
methods = ["checkm8-pongo"] # palera1n's device list (palera.in); not run with Orchard yet.

[kernel]
platform = "apple-4k"
dtb = "t7000-j97" # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Pins this board's public IPSW; the GPU firmware comes from the iPod touch 6's iOS 12.4 (16G77), the tested one.

[support]
status = "experimental"

# States: working, untested, missing, none (features.toml). Nothing here has run on
# this board with Orchard: "untested" means a driver binds in its device tree
# (tools/catalog/drivers.json), plus the display's boot console.
[features]
display = "untested"
screen_off = "untested" # Backlight darkens on idle (disp0 disabled in t7000-mini4.dtsi)
backlight = "untested"
gpu_desktop = "untested"
touch = "untested" # apple_z2 with the J96 data (C1F14,4): the ADT and mtprops match the J96's.
buttons = "untested"
accelerometer = "missing"
gyroscope = "missing"
light_sensor = "missing"
touch_id = "missing"
storage_read = "untested" # ANS1 on every A8 board (t7000-common.dtsi), as on the N102
storage_write = "untested" # Same ANS1 and asp driver as the N102
wifi = "untested" # BCM4350 over PCIe (brcmfmac), module zinfandelb; wired as on the J96.
bluetooth_input = "missing" # BlueTool has two Zinfandel patchrams per vendor (by controller revision); hci_bcm chooses by vendor only, so a unit's one isn't decidable yet
bluetooth_audio = "missing" # Same as Bluetooth input
cellular = "missing"
battery = "untested" # bq27xxx over HDQ (W1_MASTER_UART), as on the J96.
charging = "untested" # Tristar + D2207 in shared t7000-mini4.dtsi
charging_control = "untested" # Tristar + D2207 in shared t7000-mini4.dtsi
suspend = "untested"
resume = "untested"
usb_serial = "untested"
usb_network = "untested"
usb_host = "missing"
audio_output = "missing"
audio_input = "missing"
camera = "missing"
video_decode_hevc = "missing"
