# iPad mini 3 (China) (J87M): identity from public sources
# (tools/catalog/generate). In its platform's kernel, no bring-up yet; see docs/device-bring-up.md.
schema = 1
kind = "hardware.device"

[device]
profile = "j87m"
name = "iPad mini 3 (China)"
apple_products = ["iPad4,9"]
dt_compatible = ["apple,j87m"]

[match.dfu]
chip = 0x8960
board = 0x36

[boot]
methods = ["checkm8-pongo"] # checkra1n's device list (checkra.in); not run on this board with Orchard yet.
entries = ["checkra1n"]

[kernel]
platform = "apple-4k"
dtb = "s5l8960x-j87m" # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Pins this board's public IPSW; converts nothing until bring-up needs it.

[support]
status = "experimental"

# States: working, untested, missing, none (features.toml). Nothing here has run on
# this board with Orchard: "untested" means a driver binds in its device tree
# (tools/catalog/drivers.json), plus the display's boot console.
[features]
display = "untested"
screen_off = "missing"
backlight = "untested"
touch = "missing"
buttons = "untested"
accelerometer = "missing"
gyroscope = "missing"
light_sensor = "missing"
touch_id = "missing"
storage_read = "missing"
storage_write = "missing"
wifi = "missing" # the radio is described (EHCI1 port 1, ADT usb-ehci1/wlan) and the transport starts it, but iOS 12.5.8 ships no villardc TRX/NVRAM (only the kext names villardA/B/C), so there is no firmware recipe
bluetooth_input = "missing"
bluetooth_audio = "missing"
cellular = "missing"
battery = "untested" # BQ2754x on UART5 HDQ, as on every A7 iPad (ADT uart5/gas-gauge), with the J72 gauge profile; not yet run on this board
charging = "untested" # the shared A7 Tristar charger on the D2089 (ADT pmu,d2089 + tristar,cbtl1610), up to 1050 mA as measured on a J72; not yet run on this board
charging_control = "untested" # as on the J72: source identified at each plug, grant ramped, back to 100 mA on unplug; not yet run on this board
suspend = "untested"
resume = "untested"
usb_serial = "untested"
usb_network = "untested"
usb_host = "missing"
audio_output = "missing" # the speakers are two CS35L19 amplifiers on I2C2 + MCA1 (ADT i2c2/audio-speaker0/1), which have no driver
audio_input = "missing"
camera = "missing"
video_decode_hevc = "missing"
