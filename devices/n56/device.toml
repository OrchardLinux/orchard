# iPhone 6+ (N56): identity from public sources
# (tools/catalog/generate). In its platform's kernel, no bring-up yet; see docs/device-bring-up.md.
schema = 1
kind = "hardware.device"

[device]
profile = "n56"
name = "iPhone 6+"
apple_products = ["iPhone7,1"]
dt_compatible = ["apple,n56"]

[match.dfu]
chip = 0x7000
board = 0x04

[boot]
methods = ["checkm8-pongo"] # checkra1n's device list (checkra.in); not run on this board with Orchard yet.
entries = ["checkra1n"]

[kernel]
platform = "apple-4k"
dtb = "t7000-n56" # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Pins this board's public IPSW, the GPU firmware included.

[support]
status = "experimental"

# States: working, untested, missing, none (features.toml). Nothing here has run on
# this board with Orchard: "untested" means a driver binds in its device tree
# (tools/catalog/drivers.json), plus the display's boot console.
[features]
display = "untested"
screen_off = "untested" # Display pipe enabled on every A8 board, as on the N61
backlight = "untested"
gpu_desktop = "untested"
touch = "missing" # Needs N56's Gen1 clock policy (its AppleMultitouchSPI personality) in a z2fw-from-mtprops@3 recipe, as N61 has; not extracted yet
buttons = "untested"
accelerometer = "missing"
gyroscope = "missing"
light_sensor = "missing"
touch_id = "missing"
storage_read = "untested" # ANS1 on every A8 board (t7000-common.dtsi), as on the N102
storage_write = "untested" # Same ANS1 and asp driver as the N102
wifi = "untested" # BCM4345 module shared with the N102 (t7000-bcm4345.dtsi), module barbera
bluetooth_input = "untested" # Patchram follows the Wi-Fi module vendor (MUR/TDK/USI)
bluetooth_audio = "untested"
cellular = "missing"
battery = "untested" # bq27xxx over HDQ (W1_MASTER_UART); the ADT gauge matches the iPad mini 4's.
charging = "missing"
charging_control = "missing"
suspend = "untested"
resume = "untested"
usb_serial = "untested"
usb_network = "untested"
usb_host = "missing"
audio_output = "missing"
audio_input = "missing"
camera = "missing"
video_decode_hevc = "missing"
