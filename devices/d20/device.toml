# iPhone 8 (Global) (D20): identity from public sources
# (tools/catalog/generate). In its platform's kernel, no bring-up yet; see docs/device-bring-up.md.
schema = 1
kind = "hardware.device"

[device]
profile = "d20"
name = "iPhone 8 (Global)"
apple_products = ["iPhone10,1"]
dt_compatible = ["apple,d20"]

[match.dfu]
chip = 0x8015
board = 0x02

[boot]
methods = ["checkm8-pongo"] # palera1n's device list (palera.in); not run with Orchard yet.

[kernel]
platform = "apple-16k"
dtb = "t8015-d20" # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Pins this board's public IPSW; converts nothing until bring-up needs it.

[support]
status = "experimental"

# States: working, untested, missing, none (features.toml). Nothing here has run on
# this board with Orchard: "untested" means a driver binds in its device tree
# (tools/catalog/drivers.json), plus the display's boot console.
[features]
display = "untested"
screen_off = "missing"
backlight = "untested"
touch = "missing"
buttons = "missing"
accelerometer = "missing"
gyroscope = "missing"
light_sensor = "missing"
touch_id = "missing"
storage_read = "untested"
storage_write = "missing" # A driver binds, but installing waits for a RAM boot on this board.
wifi = "missing"
bluetooth_input = "missing"
bluetooth_audio = "missing"
cellular = "missing"
battery = "untested"
charging = "missing"
charging_control = "missing"
suspend = "missing"
resume = "missing"
usb_serial = "untested"
usb_network = "untested"
audio_output = "missing"
audio_input = "missing"
camera = "missing"
