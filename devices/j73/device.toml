# iPad Air (China) (J73): identity from public sources
# (tools/catalog/generate). In its platform's kernel, no bring-up yet; see docs/device-bring-up.md.
schema = 1
kind = "hardware.device"

[device]
profile = "j73"
name = "iPad Air (China)"
apple_products = ["iPad4,3"]
dt_compatible = ["apple,j73"]

[match.dfu]
chip = 0x8960
board = 0x14

[boot]
methods = ["checkm8-pongo"] # checkra1n's device list (checkra.in); not run on this board with Orchard yet.
entries = ["checkra1n"]

[kernel]
platform = "apple-4k"
dtb = "s5l8960x-j73" # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Pins this board's public IPSW; converts nothing until bring-up needs it.

[support]
status = "experimental"

# States: working, untested, missing, none (features.toml). Nothing here has run on
# this board with Orchard: "untested" means a driver binds in its device tree
# (tools/catalog/drivers.json), plus the display's boot console.
[features]
display = "untested"
screen_off = "untested" # backlight off through apple_pmic_bl (PMIC 0x600, air1.dtsi), as on the J72 (#232)
backlight = "untested"
gpu_desktop = "missing"
touch = "untested" # N1 on SPI2 as on the J72 (ADT spi2/multi-touch, multi-touch,j72), same J72.mtprops; not yet run on this board
buttons = "untested"
accelerometer = "untested" # apple-oscar on the M7 (UART4), as on the J71 where it works; same ADT wiring
gyroscope = "untested" # apple-oscar on the M7 (UART4); not mapped or used on any board yet
light_sensor = "untested" # CT819 at 0x39 on i2c0 or i2c3 (ADT als-i2c0/als-i2c3, probe-for-hardware) with tsl2583; uncalibrated lux, the ADT carries no LSCI; works on the J71; not yet run on this board
touch_id = "missing"
storage_read = "untested" # ANS (iop,s5l8960x) at the same address as on the J72, whose storage reads and writes with Orchard (ADT /arm-io/ans); not yet run on this board
storage_write = "untested" # same ANS and asp driver as the J72; not yet run on this board
wifi = "untested" # BCM43241 on HSIC, EHCI0 port 3 as on the J72 (ADT usb-ehci0/wlan, module syrahc): apple-a7-wlan + brcmfmac with this board's TRX/NVRAM recipe; not yet run on this board
bluetooth_input = "missing"
bluetooth_audio = "missing"
cellular = "missing"
battery = "untested" # BQ2754x on UART5 HDQ, as on every A7 iPad (ADT uart5/gas-gauge), with the J72 gauge profile; not yet run on this board
charging = "untested" # the shared A7 Tristar charger on the D2089 (ADT pmu,d2089 + tristar,cbtl1610), up to 1500 mA as measured on a J85; not yet run on this board
charging_control = "untested" # as on the J72: source identified at each plug, grant ramped, back to 100 mA on unplug; not yet run on this board
suspend = "untested"
resume = "untested"
usb_serial = "untested"
usb_network = "untested"
usb_host = "missing"
audio_output = "untested" # CS42L81 speakers on SPI3 + MCA0, the same wiring as the J72 (ADT spi3/audio-codec); "iPad Air Speakers" card; not yet run on this board; the same card plays on the J71 (#230)
audio_input = "missing"
camera = "missing"
video_decode_hevc = "missing"
