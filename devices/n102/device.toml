# iPod touch 6 (N102): identity from public sources (tools/catalog/generate's read_firmware);
# A8/T7000 like the iPhone 6. Installs to its internal storage next to iOS; notes in README.md.
schema = 1
kind = "hardware.device"

[device]
profile = "n102"
name = "iPod touch 6"
apple_products = ["iPod7,1"]
dt_compatible = ["apple,n102"]

[match.dfu]
chip = 0x7000
board = 0x10

[boot]
methods = ["checkm8-pongo"] # checkra1n then PongoOS and m1n1, tethered.
entries = ["checkra1n"]

[kernel]
platform = "apple-4k"
dtb = "t7000-n102" # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Pins this board's public IPSW: the touchscreen, Wi-Fi, Bluetooth and GPU firmware from it.

[support]
status = "experimental"
tested_by = ["brkosebay"]

# States: working, untested, missing, none (features.toml). "untested" means a driver
# binds in its device tree (tools/catalog/drivers.json).
[features]
display = "working" # The console and the desktop.
screen_off = "untested" # Display pipe enabled on every A8 board, as on the N61
backlight = "working" # DWI and the LM3534: brightness set and read back.
gpu_desktop = "working"
touch = "working" # N1 on apple_z2: 640x1136, several contacts.
buttons = "working" # Home, power and both volume buttons (gpio-keys).
accelerometer = "missing"
gyroscope = "missing"
light_sensor = "missing"
touch_id = "none"
storage_read = "working" # ANS1 (asp) on RTKit 10.2: the user area asp0n1 and nine read-only auxiliary namespaces.
storage_write = "working" # The user area only; asp refuses every other namespace's writes. An install next to iOS wrote asp0n1 only.
wifi = "working" # BCM4345B1 on PCIe: scans 2.4 and 5 GHz, joins a network.
bluetooth_input = "untested" # The controller comes up with its patchram; nothing paired yet.
bluetooth_audio = "untested"
cellular = "none"
battery = "working" # No fuel gauge: the D2186 PMIC's ADC and charger status (apple_d2186_battery).
charging = "working" # The D2186 input limit follows the USB host's grant, up to 1500 mA: Mac port, 0.4-0.9 A in, battery 83 -> 99 % in 10 min (Omarchy A from storage, 2026-11-26). The charge current stays as the boot loader set it (690 mA)
charging_control = "working" # The input limit only (apple_d2186_battery): input_current_limit reads 1500000 (2026-11-26)
suspend = "untested"
resume = "untested"
usb_serial = "working" # The RAM shell over USB serial (CDC ACM).
usb_network = "untested"
usb_host = "missing"
audio_output = "missing"
audio_input = "missing"
camera = "missing"
video_decode_hevc = "missing"
