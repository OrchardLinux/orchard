# iPhone 7 Plus (Intel) — D111: hardware identity, boot assets and firmware recipe.
schema = 1
kind = "hardware.device"

[device]
profile = "d111"
name = "iPhone 7 Plus (Intel)"
apple_products = ["iPhone9,4"]
dt_compatible = ["apple,d111"]

# BDID: ApBoardID/ApChipID of the d111ap identities in the 19H422 (iOS 15.8.8) BuildManifest.plist;
# cross-checked with api.ipsw.me/v4/device/iPhone9,4 ("bdid").
[match.dfu]
chip = 0x8010
board = 0x0e

[boot]
methods = ["checkm8-pongo"]
# Not published yet: no d111 launcher release exists. Mirrors the j71b URL pattern.

[kernel]
platform = "apple-16k" # kernel/series/apple-16k, kernel/configs/apple-16k
dtb = "t8010-d111"     # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Relative to this device.toml; public recipe, not firmware bytes.

[support]
status = "experimental"

# States: working, untested, missing, none (features.toml).
[features]
display = "untested"
screen_off = "untested"
backlight = "untested"
touch = "untested"
buttons = "untested"
accelerometer = "untested"
gyroscope = "untested"
light_sensor = "untested"
touch_id = "missing"
storage_read = "untested"
storage_write = "untested"
wifi = "untested"
bluetooth_input = "missing"
bluetooth_audio = "missing"
cellular = "missing"
battery = "untested"
charging = "missing"
charging_control = "missing"
suspend = "untested"
resume = "untested"
usb_serial = "untested"
usb_network = "untested"
audio_output = "missing"
audio_input = "missing"
camera = "missing"
video_decode_hevc = "missing"
