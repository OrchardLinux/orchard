# iPhone 7 Plus (Intel) — D111: hardware identity, boot assets and firmware recipe.
schema = 1
kind = "hardware.device"

[device]
profile = "d111"
name = "iPhone 7 Plus (Intel)"
apple_products = ["iPhone9,4"]
dt_compatible = ["apple,d111"]

# BDID: ApBoardID/ApChipID of the d111ap identities in the 19H422 (iOS 15.8.8) BuildManifest.plist;
# cross-checked with api.ipsw.me/v4/device/iPhone9,4 ("bdid").
[match.dfu]
chip = 0x8010
board = 0x0e

[boot]
methods = ["checkm8-pongo"]
# Not published yet: no d111 launcher release exists. Mirrors the j71b URL pattern.

[kernel]
platform = "apple-16k" # kernel/series/apple-16k, kernel/configs/apple-16k
dtb = "t8010-d111"     # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Relative to this device.toml; public recipe, not firmware bytes.

[support]
status = "experimental"

# States: working, untested, missing, none (features.toml).
[features]
display = "untested"
screen_off = "untested"
backlight = "untested"
gpu_desktop = "untested"
touch = "untested"
buttons = "untested"
accelerometer = "untested" # AOP with aopfw-t8010aop; mount-matrix not measured
gyroscope = "untested" # Same AOP firmware as the accelerometer
light_sensor = "untested"
touch_id = "missing"
storage_read = "untested"
storage_write = "untested"
wifi = "untested"
bluetooth_input = "untested" # Patchram follows the Wi-Fi module vendor (MUR/USI)
bluetooth_audio = "untested"
cellular = "missing"
battery = "untested"
charging = "untested" # SN2400 charger
charging_control = "missing" # The SN2400 driver has no writable limit yet
suspend = "untested"
resume = "untested"
usb_serial = "untested"
usb_network = "untested"
usb_host = "missing" # Needs the Tristar (cbtl1610) VBUS path on the D2333 PMU; only the iPad's D2365 one exists
audio_output = "missing" # No Linux driver for the CS42L71 codec or the CS35L26 amplifier
audio_input = "missing" # No Linux driver for the CS42L71 codec
camera = "missing"
video_decode_hevc = "untested" # VXD on for every A10; vxd-deva.bin from the recipe
