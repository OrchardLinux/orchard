# iPad Pro 10.5 (Cellular) — J208: hardware identity. Bring-up facts in
# docs/bring-up/j208.md; open work and unmerged code in README.md.
schema = 1
kind = "hardware.device"

[device]
profile = "j208"
name = "iPad Pro 10.5 (Cellular)"
apple_products = ["iPad7,4"]
dt_compatible = ["apple,j208"]

[match.dfu]
chip = 0x8011
board = 0x06

[boot]
methods = ["checkm8-pongo"]

[kernel]
platform = "apple-16k"
dtb = "t8011-j208"

[support]
install = false
status = "experimental"
caveats = [
  "The mainline t8011-j208 device tree describes the SoC and buttons only; touch, Wi-Fi, backlight, battery and light sensors are not in it yet (README.md).",
  "No firmware recipe yet; the RAM sessions used firmware read from the attached iPad.",
]
wifi = false
usb_serial = false
usb_network = false

[features]
display = "untested"
touch = "missing"
wifi = "missing"
bluetooth = "untested"
storage = "missing"
battery = "missing"
charging = "missing"
backlight = "missing"
buttons = "untested"
audio = "missing"
camera = "missing"
cellular = "missing"
suspend = "missing"
gpu = "missing"
