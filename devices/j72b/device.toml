# iPad 6 (Cellular) — J72b: hardware identity, boot assets and firmware recipe.
schema = 1
kind = "hardware.device"

[device]
profile = "j72b"
name = "iPad 6 (Cellular)"
apple_products = ["iPad7,6"]
dt_compatible = ["apple,j72b"]

# BDID: ApBoardID/ApChipID of the j72bap identities in the 21H461 (iPadOS 17.7.11) BuildManifest.plist;
# cross-checked with api.ipsw.me/v4/device/iPad7,6 ("bdid").
[match.dfu]
chip = 0x8010
board = 0x1a

[boot]
methods = ["checkm8-pongo"]
# Not published yet: no j72b launcher release exists. Mirrors the j71b URL pattern.

[kernel]
platform = "apple-16k" # kernel/series/apple-16k, kernel/configs/apple-16k
dtb = "t8010-j72b"     # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Relative to this device.toml; public recipe, not firmware bytes.

[support]
status = "experimental"

# States: working, untested, missing, none (features.toml).
[features]
display = "untested"
screen_off = "untested"
backlight = "untested"
touch = "untested"
buttons = "untested"
accelerometer = "untested"
gyroscope = "missing"
light_sensor = "missing"
touch_id = "missing"
storage_read = "untested"
storage_write = "untested"
wifi = "untested"
bluetooth_input = "missing"
bluetooth_audio = "missing"
cellular = "missing"
battery = "untested"
charging = "untested"
charging_control = "untested"
suspend = "untested"
resume = "untested"
usb_serial = "untested"
usb_network = "untested"
audio_output = "missing"
audio_input = "missing"
camera = "missing"
