# iPhone 6s+ (S8000) (N66): identity from public sources
# (tools/catalog/generate). Installs Omarchy A to internal storage; see docs/device-bring-up.md.
schema = 1
kind = "hardware.device"

[device]
profile = "n66"
name = "iPhone 6s+ (S8000)"
short_name = "iPhone 6s Plus"
apple_products = ["iPhone8,2"]
dt_compatible = ["apple,n66"]

[match.dfu]
chip = 0x8000
board = 0x06

[boot]
methods = ["checkm8-pongo"] # orchard run with Orchard's Pongo, DFU entered from Recovery, not iOS (2026-11-23)

[kernel]
platform = "apple-16k"
dtb = "s8000-n66" # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Pins this board's public IPSW; makes the touchscreen, VXD, AOP, SmartIO, Wi-Fi and Bluetooth firmware, and the GPU firmware from the iPad 5's iPadOS 16.7.10.

[support]
status = "experimental"
tested_by = ["ricktav"]

# States: working, untested, missing, none (features.toml). Nothing here has run on
# this board with Orchard: "untested" means a driver binds in its device tree
# (tools/catalog/drivers.json), plus the display's boot console.
[features]
display = "working" # boot framebuffer, 1080x1920 (RAM boot and install 2026-11-23)
screen_off = "working" # dark on Power, Home or Power lights it again in 1-15 ms (Omarchy A from storage, 2026-11-23)
backlight = "working" # dark, bright and normal levels (RAM boot 2026-11-23)
gpu_desktop = "working" # powervr boots gfx-s8003.bin; labwc composites with GLES2 through Zink on renderD128 (Omarchy A 0.3.2, Mesa 27.0.0.1; install 2026-11-24)
touch = "working" # N1 C1F5C, both firmware packets; multitouch, corners checked (RAM boot 2026-11-23)
buttons = "working" # home, power, volume up/down, mute switch (RAM boot 2026-11-23)
accelerometer = "working" # AOP with aopfw-s8000aop, measured mount matrix diag(1,1,-1); six poses give the right iio-sensor-proxy orientations (RAM boot 2026-11-23)
gyroscope = "working" # AOP MPU6800, identity matrix; rates follow the accelerometer's rotation; x sign weakly fixed, rate scale unchecked (RAM boot 2026-11-23)
light_sensor = "working" # CT821 with the unit's LSCI calibration (RAM boot 2026-11-23)
touch_id = "missing"
storage_read = "working" # NVMe 5 GT/s x2, 1 GiB read, no faults or timeouts (RAM boot 2026-11-22)
storage_write = "working" # 256 MiB to a Linux partition read back after drop_caches, APFS unchanged; Omarchy A installed and booted from storage (2026-11-23)
wifi = "working" # BCM4350/8 (C5) on PCIe port 1: firmware loads, a scan finds 31 networks; installed Omarchy A joins WPA2 networks with NetworkManager and browses in Firefox (2026-11-24, #220)
bluetooth_input = "working" # BCM4350C5 on UART1: a Logitech Bluetooth keyboard pairs, types, and reconnects without pairing again after a kernel update (Omarchy A, 2026-11-24)
bluetooth_audio = "untested"
cellular = "missing"
battery = "working" # bq27540 over HDQ through the SN2400 switch: capacity, voltage, current, temperature, charge (RAM boot 2026-11-23)
charging = "working" # SN2400, awake: Mac port at its 500 mA grant, about +0.25 A; Apple wall adapter at a 1.42 A input limit, +0.8-0.9 A. Input follows the battery temperature (2026-11-24). Asleep it is held at 300 mA
charging_control = "missing" # The SN2400 driver has no writable limit yet
suspend = "working" # s2idle from idle and from Power, 6 of 6 (3 s to 9 min), wakes on Home and Power; cable plugged in asleep (Omarchy A from storage, 2026-11-23). With the AOP running it needs the AOP GPIO domain kept on (t8010/0048): pm_test=platform and a Power wake, the AOP still answering after (RAM boot, 2026-11-24)
resume = "working" # every one of the 6 sleeps woke on Home or Power with the screen back in 1-15 ms and the USB network back (Omarchy A from storage, 2026-11-23)
usb_serial = "untested"
usb_network = "working" # USB SSH to the installed Omarchy at 172.16.42.1 (orchard exec, 2026-11-23 and 2026-11-24)
usb_host = "missing" # Needs the Tristar VBUS path on the iPhone's Antigua PMU; only the iPad 5's D2365 one exists
audio_output = "working" # speaker only; no speaker protection (V/I sense) yet, output capped at -12 dB; CS35L21 on MCA2: 440 Hz tone heard, 60 s pink-noise soak at the caps with no OTW/OTE/AMP_SHORT (RAM boots 2026-11-23, with the unit's speaker-config; the DT now carries the IPSW record, one byte different)
audio_input = "missing" # No Linux driver for the CS42L71 codec
camera = "missing"
video_decode_hevc = "untested" # VXD on for every A9; vxd-deva.bin from the recipe
