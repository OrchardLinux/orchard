# iPhone 6s+ (S8000) (N66): identity from public sources
# (tools/catalog/generate). RAM boots with storage read; see docs/device-bring-up.md.
schema = 1
kind = "hardware.device"

[device]
profile = "n66"
name = "iPhone 6s+ (S8000)"
apple_products = ["iPhone8,2"]
dt_compatible = ["apple,n66"]

[match.dfu]
chip = 0x8000
board = 0x06

[boot]
methods = ["checkm8-pongo"] # orchard run with Orchard's Pongo, DFU entered from Recovery, not iOS (2026-11-23)

[kernel]
platform = "apple-16k"
dtb = "s8000-n66" # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Pins this board's public IPSW; makes the touchscreen firmware.

[support]
status = "experimental"

# States: working, untested, missing, none (features.toml). Nothing here has run on
# this board with Orchard: "untested" means a driver binds in its device tree
# (tools/catalog/drivers.json), plus the display's boot console.
[features]
display = "untested"
screen_off = "missing"
backlight = "untested"
touch = "working" # N1 C1F5C, both firmware packets; multitouch, corners checked (RAM boot 2026-11-23)
buttons = "untested"
accelerometer = "untested"
gyroscope = "untested"
light_sensor = "working" # CT821 with the unit's LSCI calibration (RAM boot 2026-11-23)
touch_id = "missing"
storage_read = "working" # NVMe 5 GT/s x2, 1 GiB read, no faults or timeouts (RAM boot 2026-11-22)
storage_write = "working" # orchard install by ricktav: Omarchy booted from internal storage (2026-11-23)
wifi = "missing"
bluetooth_input = "missing"
bluetooth_audio = "missing"
cellular = "missing"
battery = "missing"
charging = "missing"
charging_control = "missing"
suspend = "untested"
resume = "untested"
usb_serial = "untested"
usb_network = "untested"
usb_host = "missing"
audio_output = "missing"
audio_input = "missing"
camera = "missing"
video_decode_hevc = "missing"
