# iPhone 6s+ (S8000) (N66): identity from public sources
# (tools/catalog/generate). Installs Omarchy A to internal storage; see docs/device-bring-up.md.
schema = 1
kind = "hardware.device"

[device]
profile = "n66"
name = "iPhone 6s+ (S8000)"
short_name = "iPhone 6s Plus"
apple_products = ["iPhone8,2"]
dt_compatible = ["apple,n66"]

[match.dfu]
chip = 0x8000
board = 0x06

[boot]
methods = ["checkm8-pongo"] # orchard run with Orchard's Pongo, DFU entered from Recovery, not iOS (2026-11-23)

[kernel]
platform = "apple-16k"
dtb = "s8000-n66" # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Pins this board's public IPSW; makes the touchscreen, VXD and AOP firmware, and the GPU firmware from the iPad 5's iPadOS 16.7.10.

[support]
status = "experimental"
tested_by = ["ricktav"]

# States: working, untested, missing, none (features.toml). Nothing here has run on
# this board with Orchard: "untested" means a driver binds in its device tree
# (tools/catalog/drivers.json), plus the display's boot console.
[features]
display = "working" # boot framebuffer, 1080x1920 (RAM boot and install 2026-11-23)
screen_off = "untested" # Display pipe on for every A9 board; the DSI link stays powered
backlight = "working" # dark, bright and normal levels (RAM boot 2026-11-23)
gpu_desktop = "untested"
touch = "working" # N1 C1F5C, both firmware packets; multitouch, corners checked (RAM boot 2026-11-23)
buttons = "working" # home, power, volume up/down, mute switch (RAM boot 2026-11-23)
accelerometer = "working" # AOP with aopfw-s8000aop, measured mount matrix diag(1,1,-1); six poses give the right iio-sensor-proxy orientations (RAM boot 2026-11-23)
gyroscope = "working" # AOP MPU6800, identity matrix; rates follow the accelerometer's rotation; x sign weakly fixed, rate scale unchecked (RAM boot 2026-11-23)
light_sensor = "working" # CT821 with the unit's LSCI calibration (RAM boot 2026-11-23)
touch_id = "missing"
storage_read = "working" # NVMe 5 GT/s x2, 1 GiB read, no faults or timeouts (RAM boot 2026-11-22)
storage_write = "working" # 256 MiB to a Linux partition read back after drop_caches, APFS unchanged; Omarchy A installed and booted from storage (2026-11-23)
wifi = "missing" # Not described yet: BCM4350/4345 on PCIe port 1, its control function on uart4, neither in s800-0-3.dtsi
bluetooth_input = "missing" # Not described yet: the controller is on uart1, not in s800-0-3.dtsi
bluetooth_audio = "missing" # Same as Bluetooth input
cellular = "missing"
battery = "untested" # bq27540 gauge on uart5 behind the SN2400's HDQ mux
charging = "untested" # SN2400 charger
charging_control = "missing" # The SN2400 driver has no writable limit yet
suspend = "untested"
resume = "untested"
usb_serial = "untested"
usb_network = "untested"
usb_host = "missing" # Needs the Tristar VBUS path on the iPhone's Antigua PMU; only the iPad 5's D2365 one exists
audio_output = "missing" # No Linux driver for the CS42L71 codec
audio_input = "missing" # No Linux driver for the CS42L71 codec
camera = "missing"
video_decode_hevc = "untested" # VXD on for every A9; vxd-deva.bin from the recipe
