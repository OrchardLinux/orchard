# iPad Pro 9.7-inch (Cellular) (J128): identity from public sources
# (tools/catalog/generate). In its platform's kernel, no bring-up yet; see docs/device-bring-up.md.
schema = 1
kind = "hardware.device"

[device]
profile = "j128"
name = "iPad Pro 9.7-inch (Cellular)"
apple_products = ["iPad6,4"]
dt_compatible = ["apple,j128"]

[match.dfu]
chip = 0x8001
board = 0x0a

# Orchard Recovery is built for this platform (USB "Orchard Recovery", serial
# BOARD:<profile>); it has not run on this board yet.
[match.linux]
recovery = true

[boot]
methods = ["checkm8-pongo"] # palera1n's device list (palera.in); not run with Orchard yet.

[kernel]
platform = "apple-16k"
dtb = "s8001-j128" # arch/arm64/boot/dts/apple/<dtb>.dtb

[firmware]
recipe = "firmware.json" # Pins this board's public IPSW; converts nothing until bring-up needs it.

[support]
status = "experimental"

# States: working, untested, missing, none (features.toml). Nothing here has run on
# this board with Orchard: "untested" means a driver binds in its device tree
# (tools/catalog/drivers.json), plus the display's boot console.
[features]
display = "untested"
screen_off = "missing"
backlight = "untested"
touch = "missing"
buttons = "untested"
accelerometer = "missing"
gyroscope = "missing"
light_sensor = "missing"
touch_id = "missing"
storage_read = "missing"
storage_write = "missing"
wifi = "missing"
bluetooth_input = "missing"
bluetooth_audio = "missing"
cellular = "missing"
battery = "missing"
charging = "missing"
charging_control = "missing"
suspend = "missing"
resume = "missing"
usb_serial = "untested"
usb_network = "untested"
audio_output = "missing"
audio_input = "missing"
camera = "missing"
