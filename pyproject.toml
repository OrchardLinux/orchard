[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orchard"
version = "0.3.10"
description = "Linux on Apple devices: hardware support, recipes and their producers"
readme = "README.md"
license = "GPL-2.0-only AND GPL-2.0-or-later AND MIT AND ISC"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
requires-python = ">=3.11"
# The producers need only the standard library; jsonschema validates manifests
# and descriptors in development and release CI.
dependencies = []

[project.optional-dependencies]
validate = ["jsonschema>=4.25,<5"]

[project.urls]
Repository = "https://github.com/OrchardLinux/orchard"
Documentation = "https://github.com/OrchardLinux/orchard/blob/main/BUILD.md"
Issues = "https://github.com/OrchardLinux/orchard/issues"

# Only src/orchard is a Python package: the producers and release checks a
# distribution's build runs as commands (docs/distribution-contract.md). Device
# data, recipes and device-side code are files of this checkout, which
# orchard.hardware.ROOT points at, so it runs from a checkout (an editable
# install), not from a wheel. The orchard command is OrchardLinux/tools.
[tool.setuptools]
include-package-data = false
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["jsonschema>=4.25,<5"]
