[[source]]
name = "hoolock"
url = "https://github.com/HoolockLinux/m1n1.git"
branch = "idevice"
commit = "d5a10ac52a6468484854419a6c5130f1d62073eb"
contributors = ["Nick Chan"]
devices = ["Apple A7-A11 platform support"]
license = "MIT"
patches = "patches/hoolock"
