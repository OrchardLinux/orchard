# Boot methods a board can list in device.toml [boot] methods: the chain that runs
# once the device is entered. `entries` are the ways to reach it; a board can name its
# preferred ones in [boot] entries, and the first this Orchard implements is used. A method says
# what it needs; a board's boot.json says which Apple files it uses them with.
# The code says which of these it implements (hardware.IMPLEMENTED_METHODS), so data
# can name a method newer than a CLI. Names may still change.
["checkm8-pongo"]
entries = ["palera1n", "checkra1n"]
description = "checkm8 from DFU, PongoOS, then m1n1"
boot_json = false
stages = []
loader = "m1n1"

["jailbreak-kdfu"]
entries = ["kdfu"]
description = "kDFU from a jailbroken iOS, then Cascadia's staging loader"
boot_json = false
stages = []
loader = "cascadia"

["recovery-autogo"]
entries = ["pico-checkm8", "kdfu"]
description = "Patched iBSS and iBEC with an autogo hook, then an ARM32 staging bundle"
boot_json = true
stages = ["iBSS", "iBEC"]
loader = "arm32-staging"

["custom-dfu-recovery"]
entries = ["usbliter8"]
description = "A patched iBSS, optionally iBEC, entered through an external custom DFU, then m1n1"
boot_json = true
stages = ["iBSS"]
loader = "m1n1"

["ios-local-file"]
# Starts from the running jailbroken iOS app, so it needs no DFU entry tool.
entries = []
description = "An on-device iOS app schedules wake and enters a pinned iBEC that loads an ARM32 file from System"
boot_json = true
stages = ["iBEC"]
loader = "cascadia"
