# Kernel platform: one kernel build shared by every board whose
# devices/<board>/device.toml names it in [kernel] platform.
schema = 1
kind = "hardware.platform"
name = "apple-armv7"
description = "Apple 32-bit SoCs (A5, A5X, A6, A6X): Project Cascadia's port on Linux 6.12; first board P105"

[kernel]
arch = "arm"                            # make ARCH=
image = "zImage"                        # make target; the payload's kernel file
dtbs = "arch/arm/boot/dts/apple"        # where make dtbs leaves the boards' DTBs
upstream = "kernel/upstream-v6.12.lock" # base the series applies to
series = "kernel/series/apple-armv7"    # ordered patch layers
config = "kernel/configs/apple-armv7/config"
defconfig = "orchard_applearmv7_defconfig"   # the same config in OrchardLinux/linux
branch = "armv7"                   # its branch in OrchardLinux/linux
loader = "cascadia"                # the payload format that boots this kernel

[root]
# H2FMI is built in. The installed NAND backend supplies the early root
# setup; the arm64 platforms' NVMe modules do not apply to this platform.
storage_modules = []

[recovery]
# The guarded host transport binds a fresh USB identity to each RAM boot.
identity_source = "host-usb"
usb_network = "ecm"
usb_modules = ["libcomposite", "usb_f_ecm", "usb_f_acm"]
manual_modules = ["apple_sftl"]
# Mapping recovery begins only after serial and authenticated SSH are ready.
storage_activation = "manual"
