nand_reads = "The 64 GB P105 has eight CAUs per bus, 2088 blocks per CAU and 128 normal pages per block. PR #93 matched 29 live logical pages to physical data and verified both LwVM headers. With the fusion fix, all 954 ranges of the logical disk matched an independent reconstruction from raw flash (docs/bring-up/p105-sftl-device-qualification.md)."
nand_program = "On the measured 64 GB P105, H2FMI programmed a 64 MiB file through SFTL with full readback. iOS then booted with clean System and Data filesystems (docs/bring-up/p105-nand-program.md)."
nand_checkpoint_gc = "The 64 GB P105 erased all 16 lanes of block 122 and published native accounting before one reuse. Fresh Linux loads recovered the data and wear state; iOS reclaimed the block again before a cold Linux scan found every normal and SLC page blank (docs/bring-up/p105-sftl-device-qualification.md)."
usb_phy = "P105 uses a 24 MHz reference; the proposed S5L8942X cold-handoff callbacks await an exact-revision boot (docs/bring-up/p105-usb-handoff.md)."
