# Prompt battery and charge-state updates through power_supply uevents.
# The bq27xxx gauge driver is built in, so its parameter is set at runtime
# (default 360 s). 30 s keeps UI percentages fresh while cutting HDQ UART
# polling interrupts by 3x vs 10 s; charger attach/detach still fires
# immediate uevents from the charger driver.
w /sys/module/bq27xxx_battery/parameters/poll_interval - - - - 30
