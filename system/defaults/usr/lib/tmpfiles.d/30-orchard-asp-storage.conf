# Set direct blk-mq dispatch ("none") on Apple ANS1 flash after coldplug.
# Udev rules can hit EBUSY when switching scheduler while blkid/root mount
# is probing asp0n1 during early boot; tmpfiles applies it cleanly once
# local filesystems are up. Boards without asp* disks skip silently.
w- /sys/block/asp*n*/queue/scheduler - - - - none
