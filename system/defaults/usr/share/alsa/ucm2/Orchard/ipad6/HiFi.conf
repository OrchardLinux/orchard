# iPad 6 and 7 (J71b, J72b, J171, J172): the two bottom speakers on MCA2
# through MAX98357A amplifiers, four TDM slots, and the headphone jack on
# MCA4 through the CS42L83 codec. On one J171, slots 1 and 2 drive the left
# speaker and 3 and 4 the right one; the other boards are assumed to match.
# The speakers have no hardware volume (PipeWire's software volume applies);
# the headphones use the codec's mixer volume. The jack control is the one
# simple-audio-card creates for the codec, named after its I2C device. A
# kernel without the headphone link gets the speakers only.
SectionVerb {
	Value.TQ "HiFi"
}

SectionDevice."Speaker" {
	Comment "Speakers"

	EnableSequence [
		cset "name='Speakers Switch' on"
	]
	DisableSequence [
		cset "name='Speakers Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 4
	}
}

# Only with a kernel that has the headphone link (dai-link 1).
If.headphones {
	Condition {
		Type ControlExists
		Control "name='Headphones Switch'"
	}
	True {
		SectionDevice."Headphones" {
			Comment "Headphones"

			EnableSequence [
				cset "name='Jack Mixer Volume' 43"
				cset "name='Headphones Switch' on"
			]
			DisableSequence [
				cset "name='Headphones Switch' off"
			]

			Value {
				PlaybackPriority 200
				PlaybackPCM "hw:${CardId},1"
				PlaybackChannels 2
				PlaybackMixerElem "Jack Mixer"
				JackControl "cs42l83.0-0048-jack Jack"
			}
		}
	}
}
