# iPad 6 and 7 (J71b, J72b, J171, J172): the two bottom speakers on MCA2
# through MAX98357A amplifiers, four TDM slots. On one J171, slots 1 and 2
# drive the left speaker and 3 and 4 the right one; the other boards are
# assumed to match. No hardware volume (PipeWire's software volume applies),
# one pin switch from simple-audio-card.
SectionVerb {
	Value.TQ "HiFi"
}

SectionDevice."Speaker" {
	Comment "Speakers"

	EnableSequence [
		cset "name='Speakers Switch' on"
	]
	DisableSequence [
		cset "name='Speakers Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 4
	}
}
