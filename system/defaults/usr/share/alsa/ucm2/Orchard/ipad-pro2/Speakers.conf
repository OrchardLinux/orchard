# iPad Pro 2 speakers: the four MAX98723 amplifiers on MCA2, four channels
# at 48 kHz on PCM 0 (tompta1's J120 setup, #205). No hardware volume:
# PipeWire's software volume applies; the MCA bounds full scale.
SectionVerb {
	Value.TQ "HiFi"
}

SectionDevice."Speaker" {
	Comment "Built-in speakers"
	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 4
		PlaybackRate 48000
		PlaybackPriority 100
	}
}
