# The two bottom speakers on MCA2 through MAX98357A amplifiers, four slots:
# slots 1 and 2 drive the left speaker, 3 and 4 the right one. No hardware
# volume (PipeWire's software volume applies), one pin switch from
# simple-audio-card.
SectionVerb {
	Value.TQ "HiFi"
}

SectionDevice."Speaker" {
	Comment "Speakers"

	EnableSequence [
		cset "name='Speakers Switch' on"
	]
	DisableSequence [
		cset "name='Speakers Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 4
	}
}
