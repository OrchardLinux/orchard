# The speakers of the CS42L81, as on the iPad 5; gains stay at the driver's
# defaults, with the speaker gain capped at -3 dB by the device tree.
# Headphones and the microphones are not described for this board yet.
SectionVerb {
	Value.TQ "HiFi"
}

SectionDevice."Speaker" {
	Comment "Speakers"

	EnableSequence [
		cset "name='Output Select' Speakers"
		cset "name='Speaker Playback Switch' on"
		cset "name='Speakers Switch' on"
	]
	DisableSequence [
		cset "name='Speakers Switch' off"
		cset "name='Speaker Playback Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}
