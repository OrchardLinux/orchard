# J120 MCA4 and CS42L83: stereo playback on PCM 0.
SectionVerb {
	Value.TQ "HiFi"
}

SectionDevice."Headphones" {
	Comment "Headphones"

	EnableSequence [
		cset "name='Jack Mixer Volume' 43"
		cset "name='Headphones Switch' on"
	]
	DisableSequence [
		cset "name='Headphones Switch' off"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackMixerElem "Jack Mixer"
		JackControl "cs42l83.1-0048-jack Jack"
	}
}
