# iPad Air 2 (J81): the two bottom speakers on MCA3 through MAX98721
# amplifiers, slot 0 left and slot 1 right. Each amplifier has its own gain
# control (0 mutes, 22 is the most the driver allows, the level iOS uses);
# the speakers play at that gain and PipeWire's software volume applies on
# top. The MCA driver bounds the output to -12 dB until there is speaker
# protection.
SectionVerb {
	Value.TQ "HiFi"
}

SectionDevice."Speaker" {
	Comment "Speakers"

	EnableSequence [
		cset "name='Left Speaker Volume' 22"
		cset "name='Right Speaker Volume' 22"
	]
	DisableSequence [
		cset "name='Left Speaker Volume' 0"
		cset "name='Right Speaker Volume' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}
