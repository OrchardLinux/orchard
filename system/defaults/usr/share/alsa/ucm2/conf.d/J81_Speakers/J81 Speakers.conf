# iPad Air 2 (J81): the speaker card of audio-graph-card2 "J81 Speakers"
# (arch/arm64/boot/dts/apple/t7001-air2.dtsi). audio-graph-card2 sets no
# driver name, so alsa-lib finds this file by the card name (driver
# "J81_Speakers") and its long name.
Syntax 4

SectionUseCase."HiFi" {
	Comment "Speakers"
	File "/Orchard/ipad-air2/HiFi.conf"
}
