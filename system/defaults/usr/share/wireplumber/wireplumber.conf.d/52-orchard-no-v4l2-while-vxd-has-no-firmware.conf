# The A10 video decoder (apple-vxd) registers /dev/video0, but open() fails
# with ENOENT while its firmware (apple/vxd-deva.bin) is missing.
# WirePlumber 0.5's v4l2 monitor then never finishes its create-device hook,
# and that stalls every later event: no ALSA profile, no session items and no
# links, so there is no audio at all (seen on J171 with WirePlumber 0.5.18).
# Remove this once the decoder opens without firmware or the firmware ships.
# A distro overrides it with a file of the same name in
# /etc/wireplumber/wireplumber.conf.d.
wireplumber.profiles = {
  main = {
    monitor.v4l2 = disabled
  }
}
