name: Build orchard
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: Exact prior run supplying unchanged tools and Pongo artifacts
        required: false
      nightly:
        description: Publish this run's components as the rolling nightly pre-release
        type: boolean
        default: false
  # Nightly: every published component of main, as the rolling `nightly`
  # pre-release, when main changed since the last one.
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  # By event too: a push to main must not cancel the nightly's kernel builds.
  group: orchard-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.event_name != 'schedule' }}
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check release version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: python -c 'import os, tomllib; assert os.environ["TAG"] == "v" + tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]'
      - name: Check release notes
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: ci/release-notes "$TAG" >/dev/null
      # orchard runs from its checkout: the hardware data and recipes are files beside src/.
      # jsonschema validates manifests in tests and release CI; the core needs none (tests/test_core.py).
      - run: python -m pip install -e '.[validate]' && python -m pip check
      - run: python -m unittest discover -s tests -v
  changed:
    # A scheduled run builds only when main moved since the last nightly.
    runs-on: ubuntu-24.04
    outputs:
      nightly: ${{ steps.check.outputs.nightly }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          WANTED: ${{ inputs.nightly }}
        run: |
          if [[ "$EVENT" == schedule ]]; then
            built=$(gh api "repos/$GH_REPO/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || true)
            [[ "$built" == "$GITHUB_SHA" ]] && echo nightly=false >> "$GITHUB_OUTPUT" || echo nightly=true >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT" == workflow_dispatch && "$WANTED" == true ]]; then
            echo nightly=true >> "$GITHUB_OUTPUT"
          else
            echo nightly=false >> "$GITHUB_OUTPUT"
          fi
  native-smoke:
    needs: test
    runs-on: ubuntu-24.04-arm
    env:
      ORCHARD_BUILD_NATIVE: '1'
      ORCHARD_BUILD_ENV_ID: ubuntu-24.04-arm-smoke
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Compile and execute through the native recipe runner
        run: |
          mkdir -p out/native-source out/native-output
          printf 'int main(void) { return 0; }\n' > out/native-source/test.c
          # shellcheck disable=SC2016
          python src/orchard/buildenv.py run --image unused-native \
            --bind "$PWD/out/native-source:/src:ro" --bind "$PWD/out/native-output:/out:rw" --cwd /src -- \
            bash -euc 'cc "$ORCHARD_SRC/test.c" -o "$ORCHARD_OUT/test"; "$ORCHARD_OUT/test"'
          test -s out/native-output/test
  kernel:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || needs.changed.outputs.nightly == 'true'
    needs: [native-smoke, changed]
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    timeout-minutes: 360
    strategy:
      matrix:
        # Every platform with a kernel series; distribution releases cover all of them.
        platform: [apple-16k, apple-4k, apple-armv7]
    defaults:
      run:
        shell: bash
    env:
      ORCHARD_BUILD_NATIVE: '1'
      ORCHARD_BUILD_ENV_ID: debian-bookworm-arm64-llvm19
      PLATFORM: ${{ matrix.platform }}
    steps:
      - run: apt-get update && apt-get install -y git ca-certificates python3
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Recipes need only Debian's python3 and its standard library.
      - name: Install the kernel toolchain
        run: bash kernel/install-toolchain
      - name: Build the platform kernel, modules and all device trees once
        run: |
          bash kernel/build "$PLATFORM" --work-dir "$PWD/out/kernel-work" --output "$PWD/out/components/kernel"
          dpkg-query -W > out/components/kernel-toolchain-packages.lock
      - name: Archive components and corresponding kernel source
        run: |
          tar -C out -czf "out/kernel-components-$PLATFORM.tar.gz" components
          tar -C out/kernel-work/source --exclude=.git -czf "out/kernel-source-$PLATFORM.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: orchard-kernel-${{ matrix.platform }}
          path: |
            out/kernel-components-${{ matrix.platform }}.tar.gz
            out/kernel-source-${{ matrix.platform }}.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 2
  tools:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || needs.changed.outputs.nightly == 'true'
    needs: [native-smoke, changed]
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      ORCHARD_BUILD_NATIVE: '1'
      ORCHARD_BUILD_ENV_ID: debian-bookworm-arm64-llvm19-rust1.90.0
      RUSTUP_TOOLCHAIN: '1.90.0'
    steps:
      - name: Reuse unchanged successful outputs
        if: inputs.reuse_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: orchard-tools
          path: out
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ github.token }}
      - run: apt-get update && apt-get install -y git ca-certificates python3
        if: inputs.reuse_run_id == ''
      - uses: actions/checkout@v4
        if: inputs.reuse_run_id == ''
        with:
          persist-credentials: false
      - name: Install the combined toolchain once
        if: inputs.reuse_run_id == ''
        run: |
          bash ci/install-toolchains recovery recovery-arm m1n1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build static recovery tools
        if: inputs.reuse_run_id == ''
        run: |
          OMA_RECOVERY_TOOLS_WORK="$PWD/out/recovery-tools" bash boot/initramfs/recovery/build-tools
          mkdir -p out/components/boot
          cp out/recovery-tools/bin/* out/components/boot/
      - name: Build the ARMv7 tools and the boards' Cascadia loaders
        if: inputs.reuse_run_id == ''
        run: |
          OMA_RECOVERY_TOOLS_WORK="$PWD/out/recovery-tools-arm" bash boot/initramfs/recovery/build-tools --arch arm
          mkdir -p out/components/boot-arm
          cp out/recovery-tools-arm/bin/* out/components/boot-arm/
          for profile in devices/*/cascadia.toml; do
            board=$(basename "$(dirname "$profile")")
            python3 boot/cascadia/build --profile "$profile" --output "$PWD/out/components/cascadia/$board"
          done
      - name: Build quiet loader
        if: inputs.reuse_run_id == ''
        run: |
          bash boot/m1n1/build apple --output "$PWD/out/components/quiet/m1n1.bin" \
            --work-dir "$PWD/out/loader-work" --extra-patch "$PWD/boot/quiet/m1n1.patch" \
            --extra-cflags '-DQUIET_BOOT'
          dpkg-query -W > out/components/tools-toolchain-packages.lock
          tar -C out -czf out/tool-components.tar.gz components
      - uses: actions/upload-artifact@v4
        with:
          name: orchard-tools
          path: out/tool-components.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 2
  pongo-check:
    # Pongo only builds on a Mac and doesn't change: while its recipe matches the last
    # nightly's, use that nightly's Pongo, so a Mac shortage can't hold up a nightly.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || needs.changed.outputs.nightly == 'true'
    needs: [native-smoke, changed]
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: check
        env:
          REUSE_RUN: ${{ inputs.reuse_run_id }}
        run: |
          tag= runner=macos-15
          [[ -n "$REUSE_RUN" ]] && runner=ubuntu-24.04
          if [[ -z "$REUSE_RUN" ]] && pointer=$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/nightly/latest.json"); then
            commit=$(jq -r .commit <<<"$pointer")
            if git fetch -q --depth 1 origin "$commit" && \
               git diff --quiet "$commit" HEAD -- boot/quiet/build-pongo.py boot/quiet/pongo.patch; then
              tag=$(jq -r .name <<<"$pointer") runner=ubuntu-24.04
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          if [[ -n "$tag" ]]; then echo "Pongo: from $tag, recipe unchanged" >> "$GITHUB_STEP_SUMMARY"; fi
  pongo:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || needs.changed.outputs.nightly == 'true'
    needs: [native-smoke, changed, pongo-check]
    runs-on: ${{ needs.pongo-check.outputs.runner }}
    timeout-minutes: 60
    env:
      PONGO_TAG: ${{ needs.pongo-check.outputs.tag }}
    steps:
      - name: Use the Pongo of the last nightly
        if: needs.pongo-check.outputs.tag != ''
        run: |
          mkdir -p out/quiet
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$PONGO_TAG"
          curl -fsSL -o out/SHA256SUMS "$base/SHA256SUMS"
          curl -fsSL -o out/quiet/pongo.bin "$base/pongo.bin"
          curl -fsSL -o out/pongo-source.tar.gz "$base/pongo-source.tar.gz"
          for file in pongo.bin pongo-source.tar.gz; do
            sum=$(awk -v name="./$file" '$2 == name {print $1}' out/SHA256SUMS)
            path=out/$file; [[ $file == pongo.bin ]] && path=out/quiet/pongo.bin
            echo "$sum  $path" | sha256sum -c -
          done
          tar -C out/quiet -czf out/quiet-pongo.tar.gz pongo.bin
      - name: Reuse unchanged successful outputs
        if: inputs.reuse_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: orchard-pongo
          path: out
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/checkout@v4
        if: inputs.reuse_run_id == '' && needs.pongo-check.outputs.tag == ''
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: inputs.reuse_run_id == '' && needs.pongo-check.outputs.tag == ''
        with:
          python-version: '3.14'
      - name: Fingerprint the Apple toolchain
        if: inputs.reuse_run_id == '' && needs.pongo-check.outputs.tag == ''
        id: toolchain
        run: |
          fingerprint=$({ sw_vers; xcodebuild -version; xcrun --sdk iphoneos --show-sdk-build-version; xcrun clang --version; } | shasum -a 256 | awk '{print $1}')
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: inputs.reuse_run_id == '' && needs.pongo-check.outputs.tag == ''
        id: pongo-cache
        with:
          path: |
            out/quiet-pongo.tar.gz
            out/pongo-source.tar.gz
          key: quiet-pongo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('boot/quiet/build-pongo.py', 'boot/quiet/pongo.patch') }}
      - name: Build quiet Pongo once (including newlib)
        if: steps.pongo-cache.outputs.cache-hit != 'true' && inputs.reuse_run_id == '' && needs.pongo-check.outputs.tag == ''
        run: |
          python boot/quiet/build-pongo.py --output out/quiet/pongo.bin --work-dir out/pongo-work
          tar -C out/quiet -czf out/quiet-pongo.tar.gz pongo.bin
          tar -C out/pongo-work/source --exclude=.git -czf out/pongo-source.tar.gz .
      - name: Record cache usage
        if: inputs.reuse_run_id == '' && needs.pongo-check.outputs.tag == ''
        env:
          CACHE_HIT: ${{ steps.pongo-cache.outputs.cache-hit }}
        run: |
          printf 'Quiet Pongo exact-input cache hit: %s\n' "${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: orchard-pongo
          path: |
            out/quiet-pongo.tar.gz
            out/pongo-source.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 2
  assets:
    needs: [kernel, tools, pongo]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v4
        with:
          pattern: orchard-*
          path: out/downloads
          merge-multiple: true
      - name: Assemble public component bundle without rebuilding
        run: |
          mkdir -p out/publication
          tar -xzf out/downloads/tool-components.tar.gz -C out
          tar -xzf out/downloads/quiet-pongo.tar.gz -C out/components/quiet
          # One bundle per platform carries its kernel, modules and every DTB, and the
          # shared tools and loaders; devices/<device>/device.toml names a device's DTB.
          # The tools and loaders are arm64: apple-armv7's bundle is its kernel alone.
          for platform in apple-16k apple-4k apple-armv7; do
            mkdir -p "out/platforms/$platform"
            tar -xzf "out/downloads/kernel-components-$platform.tar.gz" -C "out/platforms/$platform"
            if [[ $platform != apple-armv7 ]]; then
              cp -R out/components/boot out/components/quiet out/components/*.lock "out/platforms/$platform/components/"
            fi
            python ci/package_components.py --platform "$platform" --directory "out/platforms/$platform/components" \
              --output "out/publication/$platform-components.tar.gz"
          done
          tar -xzf out/downloads/kernel-components-apple-16k.tar.gz -C out
          # Compatibility: the shared launcher still reads the J71b bundle layout.
          bundle=out/bundles/j71b/components
          mkdir -p "$bundle/kernel"
          cp -R out/components/boot out/components/quiet out/components/*.lock "$bundle/"
          cp -R out/components/kernel/Image.gz out/components/kernel/kernel.release \
            out/components/kernel/lib "$bundle/kernel/"
          read -r _ dtb < <(python kernel/series.py --resolve j71b)
          cp "out/components/kernel/dtbs/$dtb.dtb" "$bundle/kernel/j71b.dtb"
          python ci/package_components.py --device j71b --directory "$bundle" \
            --output out/publication/j71b-components.tar.gz
          cp out/downloads/*.tar.gz out/publication/
          # orchard launch starts any device with only Pongo and the storage-capable
          # m1n1 (orchard.hardware.loader); they are release assets of their own.
          cp out/components/quiet/m1n1.bin out/components/quiet/pongo.bin out/publication/
          # orchard update fetches the core with every device and both loaders.
          python -m pip install -e .
          python -m orchard.installer core out/publication/orchard-core.pyz \
            --pongo out/components/quiet/pongo.bin --m1n1 out/components/quiet/m1n1.bin
          # Each platform's finished kernel, the installer's tools, and the index a
          # distribution builds its release from, so it stops copying any of them.
          python -m orchard.image.platforms_index out/publication --kernels out/platforms \
            --tools out/components/boot --commit "$GITHUB_SHA"
          # The same for 32-bit roots, next to it: platforms-armv7.toml.
          loaders=()
          for loader in out/components/cascadia/*/loader.bin; do
            loaders+=(--loader "$(basename "$(dirname "$loader")")=$loader")
          done
          python -m orchard.image.platforms_index out/publication --architecture arm --kernels out/platforms \
            --tools out/components/boot-arm --commit "$GITHUB_SHA" "${loaders[@]}"
          # tool-components.tar.gz stays: a distribution build takes its tools from it.
          rm out/publication/kernel-components-*.tar.gz out/publication/quiet-pongo.tar.gz
          # Source keys of each platform's kernel, m1n1 and the tools: a distribution build
          # with the same state uses these instead of building them (orchard.published).
          python -m orchard.published keys --output out/publication/component-keys.json apple-16k apple-4k apple-armv7
          git archive --format=tar.gz -o out/publication/orchard-source.tar.gz HEAD
          (cd out/publication && sha256sum ./*.tar.gz ./*.bin ./*.pyz ./component-keys.json ./platforms.toml ./platforms-armv7.toml > SHA256SUMS)
      - name: Attest public build
        if: toJSON(github.event.repository.private) == 'false'
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: out/publication/*
      - name: Include public attestation bundle
        if: toJSON(github.event.repository.private) == 'false'
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "out/publication/orchard-build.sigstore.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: orchard-release-assets
          path: out/publication/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 2
  draft:
    if: github.ref_type == 'tag'
    needs: assets
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: orchard-release-assets
          path: assets
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: source
          sparse-checkout: |
            CHANGELOG.md
            ci/release-notes
          sparse-checkout-cone-mode: false
      - name: Create draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          { (cd source && ci/release-notes "$TAG")
            printf '\n---\n\n%s\n' 'Public build assets; physical-device qualification is required before publication. Shared launcher assets are built separately.'
          } > notes.md
          gh release create "$TAG" assets/* --draft --verify-tag \
            --title "$TAG" --notes-file notes.md
  nightly:
    # Every nightly is its own immutable pre-release, nightly-YYYYMMDD-<commit>;
    # the release `nightly` only points at the newest (latest.json), and nightlies
    # older than 14 days go, the newest always stays. GitHub's "latest" release
    # (orchard update, the installer) never points at a pre-release.
    if: needs.changed.outputs.nightly == 'true' && github.ref == 'refs/heads/main'
    needs: [changed, assets]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: orchard-nightly
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: orchard-release-assets
          path: assets
      - name: Publish the nightly and point nightly at it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          (cd assets && sha256sum --check --strict SHA256SUMS)
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          name="nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::12}"
          record=$(printf '{"schema": 1, "name": "%s", "commit": "%s", "built": "%s", "run_id": %s}' \
            "$name" "$GITHUB_SHA" "$built" "$RUN_ID")
          echo "$record" > assets/nightly.json
          # A rerun of the same commit on the same day replaces that nightly.
          gh release delete "$name" --cleanup-tag --yes 2>/dev/null || true
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$name" -f sha="$GITHUB_SHA" >/dev/null
          gh release create "$name" assets/* --prerelease --verify-tag --title "$name" \
            --notes "orchard main ${GITHUB_SHA}, built ${built} (run ${RUN_ID}): the tooling (orchard-source.tar.gz) and every component. Untested on hardware; kept 14 days."
          # The pointer: tag nightly at the same commit, one asset naming the newest.
          mkdir pointer && echo "$record" > pointer/latest.json
          gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
          gh api "repos/$GH_REPO/git/refs" -f ref=refs/tags/nightly -f sha="$GITHUB_SHA" >/dev/null
          gh release create nightly pointer/latest.json --prerelease --verify-tag --title "nightly → $name" \
            --notes "Points at the newest nightly, $name (latest.json)."
      - name: Remove nightlies older than 14 days
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cutoff=$(date -u -d '14 days ago' +%Y%m%d)
          newest=$(gh release list --limit 1000 --json tagName --jq '[.[].tagName | select(test("^nightly-[0-9]{8}-[0-9a-f]{12}$"))] | sort | last')
          gh release list --limit 1000 --json tagName --jq '.[].tagName' |
            grep -E '^nightly-[0-9]{8}-[0-9a-f]{12}$' | while read -r tag; do
              day=${tag#nightly-}; day=${day%%-*}
              if [[ "$day" < "$cutoff" && "$tag" != "$newest" ]]; then
                gh release delete "$tag" --cleanup-tag --yes
              fi
            done
