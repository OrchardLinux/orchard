name: Publish verified assets
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful build run containing the final release artifact
        required: true
      artifact:
        description: Final release artifact name
        required: true
      tag:
        description: Release tag matching the embedded asset URLs
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.run_id }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Require a successful exact build
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$TAG" =~ ^v[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          [[ "$(gh run view "$RUN_ID" --json conclusion --jq .conclusion)" == success ]]
          source=$(gh run view "$RUN_ID" --json headSha --jq .headSha)
          echo "SOURCE_SHA=$source" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
          path: source
          sparse-checkout: |
            CHANGELOG.md
            ci/release-notes
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: assets
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify the existing checksums and build attestation
        run: |
          (cd assets && sha256sum --check --strict SHA256SUMS)
          gh attestation verify assets/SHA256SUMS --repo "$GH_REPO"
      # The build of a tag leaves a draft with these files. It is published as
      # it is when every file in it is the verified one; a release that is
      # already public is never changed.
      - name: Publish the draft, or create the release
        run: |
          if gh release view "$TAG" --json isDraft >/dev/null 2>&1; then
            [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" == true ]] || {
              echo "$TAG is already published" >&2; exit 1; }
            gh release view "$TAG" --json assets --jq '.assets[] | "\(.digest)  \(.name)"' | sort -k2 > draft.txt
            (cd assets && for file in *; do printf 'sha256:%s  %s\n' "$(sha256sum "$file" | cut -d' ' -f1)" "$file"; done) |
              sort -k2 > verified.txt
            diff verified.txt draft.txt || { echo "The draft's files are not the verified ones" >&2; exit 1; }
            gh release edit "$TAG" --draft=false --latest
          else
            { (cd source && ci/release-notes "$TAG")
              printf '\n---\n\n%s\n' 'Automated build and checksum verification passed.'
            } > notes.md
            gh release create "$TAG" assets/* --target "$SOURCE_SHA" --latest --title "$TAG" \
              --notes-file notes.md
          fi
