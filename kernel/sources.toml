[[source]]
name = "cascadia"
url = "https://github.com/rzxvx/Project-Cascadia.git"
branch = "main"
commit = "d92da7dd0ad356ad103af33d9129752843c33f0e"
base = "torvalds v6.12 (kernel/upstream-v6.12.lock), not [base]"
contributors = ["rzxvx", "Simone99", "Stephen Cox", "liquidmetal-Hg", "Marcolist", "Alberto Giancarlo Ferrario", "Earl Co", "K <k@Ks-MacBook-Pro-4.local>", "Claude <noreply@anthropic.com>"]
devices = ["p105 (iPad mini 1 Wi-Fi)", "j1 (iPad 3 Wi-Fi)", "k93 (iPad 2 Wi-Fi)"]
platforms = ["apple-armv7"]
license = "GPL-2.0"
patches = "patches/import/cascadia"
status = "imported"
notes = "Cascadia is a build project, not a kernel tree: v6.12 + patches/files + patches/tree/*.patch + patches/files-sandcastle-port, as its scripts/build-kernel.sh assembles them; since Cascadia aa6c5be (2026-11-04) that A5 tree is devices/a5/ of the repository. tools/kernel-tree/import-cascadia.py writes the whole layer: it rebuilds that tree with git plumbing and splits it into 0001-0023 by subsystem, with author and co-contributors from Cascadia's history per file, citing Cascadia's commit IDs; applied to v6.12 they reproduce Cascadia's tree a2122697 (at d92da7d; ad28ba4 gave 1b6135bc, 091d441 c2ee629a, c20b85e 8d7f28c8). 0024-0026 add the boards' dts/p105ap.dts, j1ap.dts and k93ap.dts to arch/arm/boot/dts/apple/ as s5l8942x-p105, s5l8945x-j1 and s5l8940x-k93, content unchanged; 0027 (Orchard) drops an unused driver copy and 0028 (Shayne Legault) restores the standard alignment fault path, both passed to the tool with --then. Not imported: dts/p102ap.dts (a generated A6X stub), the diagnostic k93ap-diag.dts and p105ap-nand-rw.dts, Cascadia's NAND-root profile for its PPN driver. 0018 is Cascadia's PPN controller and Swiss FTL (drivers/mtd/nand/apple, rzxvx); it drives the same flash as H2FMI and Orchard's patches/armv7/mtd (Shayne Legault), so the platform config leaves APPLE_PPN off and builds Orchard's stack; docs/bring-up/p105-nand-merge-proposal.md compares them. Cascadia's userspace for the A5 is not imported here: devices/a5/mesa (the SGX gallium driver, cascadia-gl) and devices/a5/app (the iOS launcher app). The seven S5L8940X drivers from files-sandcastle-port are Cascadia ports of Corellium's Project Sandcastle (https://github.com/corellium/linux-sandcastle, sandcastle-5.4, GPL-2.0, Copyright 2020 Corellium LLC). Since 091d441 Cascadia also took A12 work by dr1408 and kieroid and documentation by Jay; none of it is in the A5 kernel. Config: multi_v7_defconfig + Cascadia's config/p105ap.config and config/k93ap.config, without the build-time initramfs, Cascadia's NAND-root symbols (APPLE_PPN, APPLE_SFTL, STRICT_DEVMEM) and with LOCALVERSION_AUTO off as on the arm64 platforms (a clean release name, no git call in the build container); the iPad 2's sensors and camera as modules. Built with clang 19 here; Cascadia builds with GCC."
